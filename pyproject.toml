[project]
name = "biseojin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "openai>=1.40",
    "supabase>=2.4",
    "requests>=2.31",
    "cryptography>=42",
    # 문서함 (엑셀·워드·PDF·한글 hwpx·사진). requirements.txt 와 같게 둘 것 — Vercel 은 이 목록을 쓴다
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "pypdfium2>=4.30",
    "Pillow>=10.3",
    "lxml>=5.2",
]

# Vercel 이 다른 파일을 진입점으로 착각하지 않도록 못 박는다.
# Vercel 이 찾은 그대로: biseo/server.py 의 app.
[tool.vercel]
entrypoint = "biseo.server:app"
