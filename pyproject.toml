[project]
name = "biseojin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "openai>=1.40",
    "supabase>=2.4",
    "requests>=2.31",
]

# Vercel 이 다른 파일을 진입점으로 착각하지 않도록 못 박는다.
# Vercel 이 찾은 그대로: biseo/server.py 의 app.
[tool.vercel]
entrypoint = "biseo.server:app"
