<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비서</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="비서">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1520" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  /* 아이콘의 남색(#004880)이 중심. 확인 대기만 호박색으로 따로 */
  --bg:#F3F6FA; --surface:#FFFFFF; --ink:#13263A; --muted:#5A6B7D; --line:#D4DDE7;
  --accent:#004880; --accent-ink:#FFFFFF; --wait:#8C5300; --wait-bg:#FFF3E0; --mine:#E2ECF6;
  --tile:#004880; --tile-ink:#FFFFFF; --danger:#B3261E;
  --sans:"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0C1520; --surface:#14202D; --ink:#E3EBF3; --muted:#93A4B6; --line:#253445;
    --accent:#7AB0E0; --accent-ink:#0C1520; --wait:#E8B04A; --wait-bg:#2D2414; --mine:#1A2D42;
    --tile:#1E4E7E; --tile-ink:#EAF3FC; --danger:#F2B8B5; color-scheme: dark; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:480px;margin:0 auto;padding:0 18px;height:100%;display:flex;flex-direction:column}

/* 공통 */
.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field textarea{min-height:120px;resize:vertical}
.msg{min-height:1.4em;color:var(--muted);font-size:.9rem;margin-top:10px;white-space:pre-wrap}

/* 시작·로그인·이름 */
.auth{margin:auto 0;padding:32px 0}
.auth h1{font-size:1.5rem;font-weight:700;margin:0 0 6px}
.auth p{color:var(--muted);margin:0 0 24px;white-space:pre-wrap}
.brand{text-align:center;margin:8px 0 26px}
.brand-mark{width:72px;height:72px;margin:0 auto 14px;border-radius:20px;overflow:hidden;box-shadow:0 2px 10px rgb(0 0 0 / .1)}
.brand-mark img{width:100%;height:100%;display:block}
.brand h1{font-size:1.6rem;font-weight:800;margin:0 0 6px;color:var(--accent)}
.brand .tagline{color:var(--muted);margin:0}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.tab{flex:1;border:0;background:none;color:var(--muted);font-weight:600;padding:9px;border-radius:9px;cursor:pointer}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.pw-wrap{display:flex;gap:8px}
.pw-wrap input{flex:1;min-width:0}
.pw-eye{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;color:var(--muted);cursor:pointer;font-size:.85rem}
.btn.block{width:100%;padding:13px;margin-top:4px;font-size:1.02rem}
.linklike{display:block;margin:14px auto 0;background:none;border:0;color:var(--accent);cursor:pointer;font-size:.9rem}
.fineprint{color:var(--muted);font-size:.78rem;text-align:center;margin-top:22px;line-height:1.5}
.field input.bad{border-color:var(--danger)}
.msg.ok{color:var(--accent)}
.naming{margin:auto 0;padding:40px 0}
.naming .lead{color:var(--muted);margin:0 0 28px}
.naming .say{font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.35;margin:0;font-weight:500}
.naming .say input{font-weight:800;color:var(--accent);background:transparent;border:0;border-bottom:2px solid var(--accent);width:6.5em;text-align:center}
.naming .say input::placeholder{color:var(--line)}
.naming .note{color:var(--muted);font-size:.9rem;margin:20px 0 28px}

/* 홈 화면 */
.home{padding:20px 0 28px;overflow-y:auto;height:100%}
.home .date{color:var(--muted);font-size:.95rem}
.home h1{font-size:2rem;font-weight:800;margin:2px 0 18px;color:var(--accent);letter-spacing:-.01em}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:22px}
.widget h2{font-size:.9rem;font-weight:700;margin:0 0 8px;color:var(--muted)}
.widget .ev{display:flex;gap:10px;padding:4px 0;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.widget .ev b{font-variant-numeric:tabular-nums;min-width:3.4em;color:var(--accent)}
.widget .empty{color:var(--muted);font-size:.92rem}
.widget .next{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:.92rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:0;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--wait-bg);color:var(--wait)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0;position:relative}
.app-icon .tile{width:62px;height:62px;border-radius:17px;background:var(--tile);color:var(--tile-ink);display:grid;place-items:center;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.pin-tile svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-icon .tile svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-icon span{font-size:.8rem}
.badge{position:absolute;top:-5px;right:calc(50% - 38px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--wait);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center}

/* 앱 화면 */
.screen{display:flex;flex-direction:column;height:100%}
.screen header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.screen header h1{font-size:1.15rem;font-weight:700;margin:0;flex:1;text-align:center}
.back,.add{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 4px;min-width:64px}
.add{text-align:right;font-size:1.5rem;line-height:1}
.back{text-align:left}
.body{flex:1;overflow-y:auto;padding:12px 0 18px}
.group{font-size:.82rem;font-weight:700;color:var(--muted);margin:14px 0 6px}
.group:first-child{margin-top:0}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:.86rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:pre-wrap}
.item.wait{background:var(--wait-bg);border-color:transparent;border-left:3px solid var(--wait);cursor:default}
.empty-state{color:var(--muted);text-align:center;padding:40px 10px;white-space:pre-wrap}
.toggle{margin-bottom:10px}
.actionbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.actionbar input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.shortcuts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sc{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:.9rem;font-weight:600}
.sc .mini{width:16px;height:16px;display:inline-grid;place-items:center}
.sc .mini svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sc.add{color:var(--muted);font-weight:500;border-style:dashed}
.sc .x{color:var(--muted);margin-left:2px;font-weight:400}
.item .lead{display:flex;align-items:center;gap:10px}
.item .lead .mini{width:22px;height:22px;flex:none;display:inline-grid;place-items:center}
.item .lead .mini svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card .lead{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.card .lead .mini{width:20px;height:20px;flex:none;display:inline-grid;place-items:center}
.card .lead .mini svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* 채팅 */
.log{flex:1;overflow-y:auto;padding:14px 0 8px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.bubble.agent{background:var(--surface);align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--line)}
.bubble.user{background:var(--mine);align-self:flex-end;border-bottom-right-radius:4px}
.bubble.thinking{color:var(--muted)}
.links{align-self:flex-start;display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
.links button{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:.82rem;cursor:pointer}
.links button.suggest{border-color:var(--accent);font-weight:600}
.links button.suggest.done{border-color:var(--line);color:var(--muted);font-weight:400}
.links button:disabled{opacity:.6;cursor:default}
form.compose{display:flex;gap:8px;padding:10px 0 14px;border-top:1px solid var(--line)}
form.compose textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);max-height:140px}

/* 맡은 일·확인함 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px 14px 14px 4px;padding:11px 14px;margin-bottom:8px}
.card.ask,.card.wait{background:var(--wait-bg);border-color:transparent;border-left-color:var(--wait)}
.card.ended{border-left-color:var(--line)}
.card .t{font-weight:600}
.card .s{color:var(--muted);font-size:.85rem}
.card .b{margin:4px 0 8px;white-space:pre-wrap}
.card .row input{flex:1 1 100%;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

/* 시트(편집 창) */
dialog.sheet{border:0;border-radius:20px 20px 0 0;background:var(--bg);color:var(--ink);width:100%;max-width:480px;margin:auto auto 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto}
dialog.sheet::backdrop{background:rgb(0 0 0 / .35)}
.sheet h2{font-size:1.1rem;margin:0 0 14px}
.sheet .sub{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.sheet .sub h3{font-size:.9rem;margin:0 0 8px;color:var(--muted)}
.linked{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:.92rem}
.linked span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linked button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.85rem}
.sheet .actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
code.topic{display:block;background:var(--surface);border:1px solid var(--line);padding:8px 10px;border-radius:8px;word-break:break-all;margin:8px 0}
/* 로딩 자리표시(스켈레톤): 빈 화면 대신 윤곽을 먼저 보여 준다 */
.skel{background:var(--surface);border:1px solid var(--line);border-radius:14px;height:64px;margin-bottom:8px;overflow:hidden;position:relative}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(127,127,127,.08),transparent);transform:translateX(-100%)}
.app-icon .tile{transition:transform .12s ease, box-shadow .12s ease}
.app-icon:active .tile{transform:scale(.94)}
.item,.card,.sc,.btn{transition:transform .1s ease, opacity .15s ease}
.item:active,.card:active{transform:scale(.99)}
.btn:active,.sc:active{transform:scale(.96)}
@media (prefers-reduced-motion: no-preference){
  .bubble.new{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .screen:not([hidden]) .body > *,.home:not([hidden]) .widget,.home:not([hidden]) .grid{animation:fade .22s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .skel::after{animation:shimmer 1.3s infinite}
  @keyframes shimmer{to{transform:translateX(100%)}}
}
</style>
</head>
<body>
<div class="wrap">

  <section class="auth" id="boot">
    <h1>불러오는 중</h1>
    <p id="bootMsg">잠시만 기다려 주세요.</p>
  </section>

  <section class="auth" id="auth" hidden>
    <div class="brand">
      <div class="brand-mark"><img src="/icon-192.png" alt=""></div>
      <h1>나만의 비서</h1>
      <p class="tagline">일정·메모·할 일을 맡기면, 알아서 챙겨 주는 비서예요.</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab on" id="tabLogin" role="tab">로그인</button>
      <button class="tab" id="tabSignup" role="tab">회원가입</button>
    </div>

    <form id="authForm" novalidate>
      <label class="field"><span>이메일</span>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email"></label>
      <label class="field"><span>비밀번호</span>
        <span class="pw-wrap">
          <input id="pw" type="password" placeholder="6자 이상" autocomplete="current-password">
          <button type="button" class="pw-eye" id="pwEye" aria-label="비밀번호 보기">보기</button>
        </span>
      </label>
      <label class="field" id="pw2Field" hidden><span>비밀번호 확인</span>
        <input id="pw2" type="password" placeholder="한 번 더" autocomplete="new-password"></label>
      <div class="msg" id="authMsg"></div>
      <button class="btn block" id="authSubmit" type="submit">로그인</button>
    </form>

    <button class="linklike" id="forgot">비밀번호를 잊으셨나요?</button>
    <p class="fineprint">가입하면 서비스 이용에 동의하는 것으로 간주돼요. 기록은 본인만 볼 수 있어요.</p>
  </section>

  <section class="naming" id="naming" hidden>
    <p class="lead">먼저 비서에게 이름을 지어 주세요.</p>
    <p class="say">안녕하세요, 저는<br><input id="nameInput" maxlength="12" placeholder="이름" aria-label="비서 이름">예요.</p>
    <p class="note">나중에 설정에서 바꿀 수 있어요. 열두 글자까지 돼요.</p>
    <button class="btn" id="saveName" disabled>이 이름으로 정하기</button>
    <div class="msg" id="nameMsg"></div>
  </section>

  <!-- 홈 화면 -->
  <section class="home" id="home" hidden>
    <div class="date" id="today"></div>
    <h1 id="agentName"></h1>
    <div class="widget" id="widget"></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 앱 화면 (하나를 돌려 쓴다) -->
  <section class="screen" id="screen" hidden>
    <header>
      <button class="back" id="back">‹ 홈</button>
      <h1 id="screenTitle"></h1>
      <button class="add" id="addBtn" aria-label="새로 만들기">+</button>
    </header>
    <div class="body" id="screenBody"></div>
    <form class="compose" id="compose" hidden>
      <textarea id="text" rows="1" placeholder="부탁할 일을 적어 주세요"></textarea>
      <button class="btn" id="send">보내기</button>
    </form>
  </section>
</div>

<dialog class="sheet" id="sheet"></dialog>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let sb, agentName = "", current = null;

/* ---------- 서버 ---------- */
let _token = null;
async function token() {
  if (_token && _token.exp > Date.now() / 1000 + 60) return _token.v;
  const { data } = await sb.auth.getSession();
  const v = data.session?.access_token;
  try { _token = { v, exp: JSON.parse(atob(v.split(".")[1])).exp }; } catch { _token = { v, exp: 0 }; }
  return v;
}
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}`, ...(opts.headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `요청이 실패했어요 (${res.status})`);
  return body;
}
/* ---------- 화면 데이터 캐시: 먼저 보여 주고, 뒤에서 갱신 ---------- */
const cache = {
  store: new Map(),
  paths: { home: "/api/home", events: "/api/events", reminders: "/api/reminders",
           notes: "/api/notes", drafts: "/api/drafts", tasks: "/api/tasks",
           actions: "/api/actions", skills: "/api/skills", history: "/api/history" },
  has(k) { return this.store.has(k); },
  peek(k) { return this.store.get(k); },
  async get(k) { return this.store.has(k) ? this.store.get(k) : this.fresh(k); },
  async fresh(k) { const v = await api(this.paths[k]); this.store.set(k, v); return v; },
  drop(...ks) { for (const k of ks) this.store.delete(k); },
  clear() { this.store.clear(); },
  async warm() { await Promise.all(Object.keys(this.paths).map((k) => this.fresh(k).catch(() => {}))); },
};

const CACHE_TOUCH = [
  [/\/api\/(events)\b/, ["events", "home", "reminders", "notes"]],   // 일정은 알림·메모와 얽힘
  [/\/api\/(reminders)\b/, ["reminders", "home"]],
  [/\/api\/(notes)\b/, ["notes"]],
  [/\/api\/(drafts)\b/, ["drafts"]],
  [/\/api\/(tasks)\b/, ["tasks", "home"]],
  [/\/api\/(actions|skills)\b.*\/(approve|reject|undo|run|remove|pin|unpin)/, ["actions", "tasks", "skills", "home", "events", "reminders", "notes", "drafts"]],
  [/\/api\/(shortcuts|search)\b/, ["tasks", "home"]],
  [/\/api\/(chat)\b/, ["history", "actions", "tasks", "home", "events", "reminders", "notes", "drafts", "skills"]],
  [/\/api\/(name)\b/, ["home"]],
];
async function post(path, body) {
  const r = await api(path, { method: "POST", body: JSON.stringify(body || {}) });
  for (const [re, keys] of CACHE_TOUCH) if (re.test(path)) cache.drop(...keys);
  return r;
}

/* ---------- 시각 ---------- */
const pad = (n) => String(n).padStart(2, "0");
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const fromLocalInput = (v) => (v ? new Date(v).toISOString() : null);
const hm = (iso) => new Date(iso).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
const md = (iso) => new Date(iso).toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
const when = (iso) => `${md(iso)} ${hm(iso)}`;
function inHour(h = 1) { const d = new Date(); d.setMinutes(0, 0, 0); d.setHours(d.getHours() + h); return d.toISOString(); }

/* ---------- 홈 ---------- */
async function goHome() {
  current = null;
  show("home");
  $("today").textContent = new Date().toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });
  $("agentName").textContent = agentName;
  if (cache.has("home")) {                 // 바로 그리고
    paintHome(cache.peek("home"));
    cache.fresh("home").then((h) => { if (!current) paintHome(h); }).catch(() => {});
  } else {
    paintHome(await cache.get("home").catch(() => ({ events: [], pending: 0, asking: 0 })));
  }
}

function paintHome(h) {
  const w = $("widget"); w.replaceChildren(el("h2", "", "오늘"));
  if (!h.events.length) w.append(el("div", "empty", "오늘 일정이 없어요."));
  for (const e of h.events) {
    const b = el("button", "ev");
    b.append(el("b", "", hm(e.starts_at)), el("span", "", e.title + (e.place ? ` · ${e.place}` : "")));
    b.onclick = () => openApp("events").then(() => editEvent(e.id));
    w.append(b);
  }
  if (h.next_reminder) w.append(el("div", "next", `다음 알림 · ${when(h.next_reminder.due_at)} — ${h.next_reminder.text}`));
  const chips = el("div", "chips");
  if (h.pending) { const c = el("button", "chip", `확인할 일 ${h.pending}`); c.onclick = () => openApp("inbox"); chips.append(c); }
  if (h.asking) { const c = el("button", "chip", `답을 기다리는 질문 ${h.asking}`); c.onclick = () => openApp("tasks"); chips.append(c); }
  if (chips.children.length) w.append(chips);

  // 빠른 실행: 자주 하는 지시를 버튼 한 번으로. 채팅 앱을 열고 그 말을 바로 보낸다.
  const quick = el("div", "shortcuts"); quick.style.margin = "4px 0 20px";
  const QUICK = [
    ["오늘 브리핑", "오늘 일정과 할 일을 짧게 브리핑해줘"],
    ["이번 주 정리", "이번 주 해야 할 일을 정리해줘"],
    ["안 끝난 일", "아직 안 끝난 과제와 확인할 일을 알려줘"],
  ];
  for (const [label, msg] of QUICK) {
    const b = el("button", "sc"); b.append(miniIcon("bolt", "blue"), el("span", "", label));
    b.onclick = () => runInChat(msg);
    quick.append(b);
  }
  w.append(quick);

  const tiles = APPS.map(([key, label]) => {
    const b = el("button", "app-icon");
    b.innerHTML = `<div class="tile"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[key]}</svg></div>`;
    b.append(el("span", "", label));
    if (key === "inbox" && h.pending) b.append(el("div", "badge", String(h.pending)));
    if (key === "tasks" && h.asking) b.append(el("div", "badge", String(h.asking)));
    b.onclick = () => openApp(key);
    return b;
  });
  // 홈에 올린 기능·단축 버튼도 같은 격자에 타일로 (색 있는 아이콘)
  for (const pin of (h.pins || [])) {
    const b = el("button", "app-icon");
    const tile = el("div", "tile pin-tile");
    tile.style.background = TINT[pin.tint] || TINT.indigo;
    tile.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[pin.icon] || ICON.bolt}</svg>`;
    b.append(tile, el("span", "", pin.label));
    b.onclick = () => runPin(pin);
    tiles.push(b);
  }
  $("grid").replaceChildren(...tiles);
}

// 홈 타일을 누르면: 무엇에 쓸지 적는 작은 창. 비우고 실행하면 그냥 실행.
function runPin(pin) {
  const ep = pin.skill ? `/api/skills/${pin.id}/run` : `/api/shortcuts/${pin.id}/run`;
  openSheet(pin.label, (s) => {
    const inp = input("text", "", { placeholder: "무엇에 쓸지 적어 주세요 (비워도 돼요)" });
    s.append(field("요청 내용", inp));
    s.append(el("p", "muted", "적은 내용으로 과제를 시작해요. 비워 두면 기본 동작으로 실행돼요."));
    const foot = el("div", "actions");
    foot.append(el("span"), button("실행", "", async () => {
      await post(ep, { text: inp.value.trim() });
      closeSheet(); await openApp("tasks");
    }));
    s.append(foot);
    setTimeout(() => inp.focus(), 50);
  });
}

/* ---------- 앱 열기 ---------- */
const SCREENS = {};
async function openApp(key, push = true) {
  current = key;
  show("screen");
  $("screenTitle").textContent = APPS.find((a) => a[0] === key)[1];
  $("compose").hidden = key !== "chat";
  $("addBtn").style.visibility = SCREENS[key].add ? "visible" : "hidden";
  $("addBtn").onclick = SCREENS[key].add || null;
  if (push) history.pushState({ app: key }, "", "#" + key);
  await render();
}
async function render(revalidate = true) {
  const body = $("screenBody");
  const key = SCREENS[current].cacheKey;
  try {
    if (key && cache.has(key)) {
      // 지난번 받아 둔 값으로 즉시 그린다 (서버를 안 기다린다)
      await SCREENS[current].render(body, cache.peek(key));
      if (revalidate) {
        cache.fresh(key).then((v) => {
          if (current && SCREENS[current].cacheKey === key) SCREENS[current].render(body, v).catch(() => {});
        }).catch(() => {});
      }
    } else {
      if (key) body.replaceChildren(el("div", "skel"), el("div", "skel"), el("div", "skel"));
      await SCREENS[current].render(body, key ? await cache.get(key) : null);
    }
  } catch (e) { body.replaceChildren(el("div", "empty-state", e.message)); }
}
$("back").onclick = () => history.back();
window.addEventListener("popstate", (e) => (e.state?.app ? openApp(e.state.app, false) : goHome()));

function listOrEmpty(body, nodes, emptyText) {
  body.replaceChildren(...(nodes.length ? nodes : [el("div", "empty-state", emptyText)]));
}
function itemBtn(title, sub, onClick) {
  const b = el("button", "item"); b.append(el("div", "t", title));
  if (sub) b.append(el("div", "s", sub));
  b.onclick = onClick; return b;
}

/* ---------- 시트(편집 창) ---------- */
function openSheet(title, build) {
  const s = $("sheet"); s.replaceChildren(el("h2", "", title)); build(s);
  if (!s.open) s.showModal();
}
const closeSheet = () => $("sheet").close();
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });
function field(label, input) { const l = el("label", "field"); l.append(el("span", "", label), input); return l; }
function input(type, value, attrs = {}) { const i = el(type === "textarea" ? "textarea" : "input"); if (type !== "textarea") i.type = type; i.value = value ?? ""; Object.assign(i, attrs); return i; }
function sheetActions(onSave, onDelete) {
  const row = el("div", "actions");
  if (onDelete) row.append(button("삭제", "danger", async () => { if (confirm("지울까요?")) { await onDelete(); closeSheet(); await render(); } }));
  else row.append(el("span"));
  row.append(button("저장", "", async () => { await onSave(); closeSheet(); await render(); }));
  return row;
}
function button(label, kind, onClick) {
  const b = el("button", "btn" + (kind ? " " + kind : ""), label);
  b.onclick = async (e) => { e.preventDefault(); b.disabled = true; try { await onClick(); } catch (err) { alert(err.message); } finally { b.disabled = false; } };
  return b;
}

SCREENS.events = {
  cacheKey: "events",
  async render(body, data) {
    const { items } = data || await cache.get("events");
    const nodes = []; let last = "";
    for (const e of items) {
      const day = md(e.starts_at);
      if (day !== last) { nodes.push(el("div", "group", day)); last = day; }
      nodes.push(itemBtn(`${hm(e.starts_at)} · ${e.title}`, e.place || "", () => editEvent(e.id)));
    }
    listOrEmpty(body, nodes, "다가오는 일정이 없어요.\n+ 를 누르거나 채팅에서 \u201c목요일 3시 회의, 30분 전에 알려 줘\u201d처럼 말해 보세요.");
  },
  add: () => editEvent(null),
};

async function editEvent(id) {
  const ev = id ? await api(`/api/events/${id}`) : { title: "", starts_at: inHour(1), reminders: [], notes: [] };
  openSheet(id ? "일정" : "새 일정", (s) => {
    const title = input("text", ev.title, { placeholder: "무슨 일정인가요?" });
    const start = input("datetime-local", toLocalInput(ev.starts_at));
    const end = input("datetime-local", toLocalInput(ev.ends_at));
    const place = input("text", ev.place, { placeholder: "장소 (선택)" });
    s.append(field("이름", title), field("시작", start));
    s.append(quickTimes((d) => { start.value = toLocalInput(d.toISOString()); }));
    s.append(field("끝 (선택)", end), field("장소", place));
    let remindNew = null;
    if (!id) {
      remindNew = el("select");
      for (const [v, t] of [["", "알림 없음"], ["10", "10분 전"], ["30", "30분 전"], ["60", "1시간 전"], ["1440", "하루 전"]]) {
        const o = el("option", "", t); o.value = v; remindNew.append(o);
      }
      s.append(field("알림", remindNew));
    }
    if (id) {
      // 연동: 이 일정에 붙은 알림
      const r = el("div", "sub"); r.append(el("h3", "", "붙은 알림"));
      for (const x of ev.reminders) {
        const line = el("div", "linked");
        line.append(el("span", "", `${when(x.due_at)} · ${x.status === "sent" ? "보냄" : x.text}`));
        const del = el("button", "", "지우기");
        del.onclick = async () => { await post(`/api/reminders/${x.id}/delete`); editEvent(id); };
        line.append(del); r.append(line);
      }
      const sel = el("select"); sel.style.cssText = "flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)";
      for (const [v, t] of [["10", "10분 전"], ["30", "30분 전"], ["60", "1시간 전"], ["1440", "하루 전"]]) { const o = el("option", "", t); o.value = v; sel.append(o); }
      const add = el("div", "row"); add.append(sel, button("알림 붙이기", "ghost small", async () => { await post(`/api/events/${id}/remind`, { minutes: Number(sel.value) }); editEvent(id); }));
      r.append(add); s.append(r);
      // 연동: 이 일정에 붙은 메모
      const n = el("div", "sub"); n.append(el("h3", "", "붙은 메모"));
      for (const x of ev.notes) {
        const line = el("div", "linked"); line.append(el("span", "", x.title || x.content.split("\n")[0]));
        const open = el("button", "", "열기"); open.onclick = () => editNote(x.id, x, id);
        line.append(open); n.append(line);
      }
      const memo = input("text", "", { placeholder: "이 일정에 메모 붙이기" });
      memo.style.cssText = "flex:1 1 100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)";
      const addN = el("div", "row"); addN.append(memo, button("붙이기", "ghost small", async () => { await post("/api/notes/new", { content: memo.value, event_id: id }); editEvent(id); }));
      n.append(addN); s.append(n);
    }
    s.append(sheetActions(async () => {
      const data = { title: title.value, starts_at: fromLocalInput(start.value), ends_at: fromLocalInput(end.value), place: place.value };
      if (id) await post(`/api/events/${id}/update`, data);
      else await post("/api/events/new", { ...data, remind_before_min: remindNew.value || null });
    }, id ? () => post(`/api/events/${id}/delete`) : null));
  });
}

/* ===================== 메모 ===================== */
SCREENS.notes = {
  cacheKey: "notes",
  async render(body, data) {
    const { items } = data || await cache.get("notes");
    listOrEmpty(body, items.map((n) => itemBtn(n.title || n.content.split("\n")[0].slice(0, 40),
      `${md(n.updated_at)}${n.event_id ? " · 일정에 붙음" : ""}\n${n.title ? n.content : n.content.split("\n").slice(1).join(" ")}`.trim(),
      () => editNote(n.id, n))), "메모가 없어요.");
  },
  add: () => editNote(null, { content: "" }),
};

async function editNote(id, n, backToEvent) {
  const { items: events } = await api(`/api/events?start=${encodeURIComponent(new Date(Date.now() - 30 * 864e5).toISOString())}`);
  openSheet(id ? "메모" : "새 메모", (s) => {
    const title = input("text", n.title, { placeholder: "제목 (선택)" });
    const content = input("textarea", n.content, { placeholder: "내용" });
    const link = el("select"); const none = el("option", "", "연결 안 함"); none.value = ""; link.append(none);
    for (const e of events) { const o = el("option", "", `${md(e.starts_at)} ${e.title}`); o.value = e.id; if (e.id === (n.event_id ?? backToEvent)) o.selected = true; link.append(o); }
    s.append(field("제목", title), field("내용", content), field("일정에 붙이기", link));
    s.append(sheetActions(async () => {
      const data = { title: title.value, content: content.value, event_id: link.value ? Number(link.value) : null };
      if (id) await post(`/api/notes/${id}/update`, data); else await post("/api/notes/new", data);
      if (backToEvent) setTimeout(() => editEvent(backToEvent), 0);
    }, id ? () => post(`/api/notes/${id}/delete`) : null));
  });
}

let showPastReminders = false;
SCREENS.reminders = {
  cacheKey: "reminders",
  async render(body, data) {
    const { items } = showPastReminders ? await api("/api/reminders?past=1")
                                        : (data || await cache.get("reminders"));
    const t = button(showPastReminders ? "다가올 알림 보기" : "지난 알림 보기", "ghost small toggle", async () => { showPastReminders = !showPastReminders; await render(); });
    const nodes = items.map((r) => itemBtn(r.text, `${when(r.due_at)}${r.event_id ? " · 일정에 붙음" : ""}${r.status === "sent" ? " · 보냄" : ""}`,

  },
  add: () => editReminder({ text: "", due_at: inHour(1) }),

function quickTimes(setIso) {
  const wrap = el("div", "shortcuts");
  const opts = [
    ["30분 뒤", () => { const d = new Date(); d.setMinutes(d.getMinutes() + 30); return d; }],
    ["1시간 뒤", () => { const d = new Date(); d.setHours(d.getHours() + 1); return d; }],
    ["3시간 뒤", () => { const d = new Date(); d.setHours(d.getHours() + 3); return d; }],
    ["오늘 저녁 7시", () => { const d = new Date(); d.setHours(19, 0, 0, 0); return d; }],
    ["내일 아침 8시", () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0); return d; }],
  ];
  for (const [label, fn] of opts) {
    const b = el("button", "sc"); b.textContent = label;
    b.onclick = (e) => { e.preventDefault(); setIso(fn()); };
    wrap.append(b);
  }
  return wrap;
}
function editReminder(r) {
  openSheet(r.id ? "알림" : "새 알림", (s) => {
    const text = input("text", r.text, { placeholder: "무엇을 알려 드릴까요?" });
    const due = input("datetime-local", toLocalInput(r.due_at));
    s.append(field("내용", text), field("시각", due));
    s.append(quickTimes((d) => { due.value = toLocalInput(d.toISOString()); }));
    if (r.event_id) s.append(el("p", "muted", "일정에 붙은 알림이에요. 시각을 직접 바꾸면 일정과 따로 움직여요."));
    s.append(sheetActions(async () => {
      const data = { text: text.value, due_at: fromLocalInput(due.value) };
      if (r.id) await post(`/api/reminders/${r.id}/update`, data); else await post("/api/reminders/new", data);
    }, r.id ? () => post(`/api/reminders/${r.id}/delete`) : null));
  });
}

const TASK_STATE = { open: "진행 중", waiting_user: "답을 기다려요", waiting_approval: "확인을 기다려요", done: "끝났어요", stopped: "멈췄어요" };
SCREENS.tasks = {
  cacheKey: "tasks",
  async render(body, data) {
    const { live, ended } = data || await cache.get("tasks");
    const head = el("div");
    head.append(await actionBar("tasks", "맡길 일을 적어 주세요", async (v) => { await post("/api/tasks", { goal: v }); await render(); }));
    head.append(await shortcutBar("tasks"));

function splitResult(text) {
  // ```lang ... ``` 코드블록을 분리해 [{type:'text'|'code', lang, body}] 로
  const parts = []; const re = /```([\w+-]*)\n?([\s\S]*?)```/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parts.push({ type: "text", body: text.slice(last, m.index).trim() });
    parts.push({ type: "code", lang: m[1] || "", body: m[2].replace(/\n$/, "") });
    last = re.lastIndex;
  }
  if (last < text.length) parts.push({ type: "text", body: text.slice(last).trim() });
  return parts.filter((p) => p.body);
}
async function openResult(taskId) {
  let t;
  try { t = await api(`/api/tasks/${taskId}`); } catch (e) { return alert(e.message); }
  const result = t.result || "";
  openSheet(t.goal || "결과", (s) => {
    s.classList.add("result-sheet");
    if (t.reflection) s.append(el("p", "muted", "비서 메모: " + t.reflection + (t.quality ? ` (자평 ${t.quality}/5)` : "")));
    for (const part of splitResult(result)) {
      if (part.type === "code") {
        const box = el("div", "codebox");
        const bar = el("div", "codebar");
        bar.append(el("span", "lang", part.lang || "code"),
          button("복사", "ghost small", async () => { await navigator.clipboard.writeText(part.body); alert("복사했어요."); }));
        const pre = el("pre"); pre.textContent = part.body;
        box.append(bar, pre); s.append(box);
      } else {
        const p2 = el("div", "resulttext"); p2.textContent = part.body; s.append(p2);
      }
    }
    const foot = el("div", "actions");
    foot.append(button("전체 복사", "ghost", async () => { await navigator.clipboard.writeText(result); alert("전체 복사했어요."); }),
      button("파일로 저장", "", () => {
        const blob = new Blob([result], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob); const a = el("a");
        a.href = url; a.download = (t.goal || "결과").slice(0, 30).replace(/[^\w가-힣-]/g, "_") + ".txt";
        a.click(); URL.revokeObjectURL(url);
      }));
    s.append(foot);
  });
}

/* ===================== 설정 ===================== */
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function urlB64ToBytes(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}
async function currentSub() {
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
async function enablePush() {
  if (isIOS() && !isStandalone()) throw new Error("아이폰은 홈 화면에 추가한 앱에서만 알림을 켤 수 있어요.\n사파리 공유 버튼 → 홈 화면에 추가 → 그 아이콘으로 열어서 다시 눌러 주세요.");
  if (!pushSupported()) throw new Error("이 브라우저는 앱 알림을 지원하지 않아요.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("알림이 허용되지 않았어요. 기기 설정에서 이 앱의 알림을 허용해 주세요.");
  const reg = await navigator.serviceWorker.register("/sw.js");
  await navigator.serviceWorker.ready;
  const { key } = await api("/api/push/key");
  const sub = (await reg.pushManager.getSubscription()) ||
    await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(key) });
  const device = isIOS() ? "아이폰" : /Android/.test(navigator.userAgent) ? "안드로이드" : "컴퓨터";
  await post("/api/push/subscribe", { subscription: sub.toJSON(), device });
}
async function disablePush() {
  const sub = await currentSub();
  if (sub) { await post("/api/push/unsubscribe", { endpoint: sub.endpoint }); await sub.unsubscribe(); }
}

});
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("compose").requestSubmit(); }
});
async function runInChat(message) {
  await openApp("chat");
  $("text").value = message;
  $("compose").requestSubmit();
}

/* ===================== 로그인·회원가입 ===================== */
let authMode = "login";
function setAuthMode(m) {
  authMode = m;
  $("tabLogin").classList.toggle("on", m === "login");
  $("tabSignup").classList.toggle("on", m === "signup");
  $("pw2Field").hidden = m !== "signup";
  $("pw").setAttribute("autocomplete", m === "signup" ? "new-password" : "current-password");
  $("authSubmit").textContent = m === "signup" ? "회원가입" : "로그인";
  setAuthMsg("");
}
function setAuthMsg(text, ok = false) {
  const m = $("authMsg"); m.textContent = text; m.classList.toggle("ok", ok);
}
function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

async function submitAuth() {
  const email = $("email").value.trim();
  const password = $("pw").value;
  $("email").classList.toggle("bad", !!email && !validEmail(email));
  if (!validEmail(email)) return setAuthMsg("이메일 형식을 확인해 주세요.");
  if (password.length < 6) return setAuthMsg("비밀번호는 6자 이상이어야 해요.");
  if (authMode === "signup" && password !== $("pw2").value) return setAuthMsg("비밀번호가 서로 달라요.");

  $("authSubmit").disabled = true;
  setAuthMsg(authMode === "signup" ? "계정을 만드는 중…" : "로그인 중…");
  try {
    if (authMode === "signup") {
      const { data, error } = await sb.auth.signUp({
        email, password, options: { emailRedirectTo: location.origin },
      });
      if (error) throw error;
      if (!data.session) {   // 확인 메일 방식
        setAuthMsg("확인 메일을 보냈어요. 메일의 링크를 누르면 바로 시작돼요. 메일이 안 보이면 스팸함도 확인해 주세요.", true);
        return;
      }
      await enter();         // 확인 메일이 꺼져 있으면 바로 입장
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await enter();
    }
  } catch (e) {
    const msg = e.message || "";
    setAuthMsg(
      msg.includes("Invalid login") ? "이메일이나 비밀번호가 맞지 않아요." :
      msg.includes("already registered") || msg.includes("already been") ? "이미 가입된 이메일이에요. 로그인해 주세요." :
      msg.includes("not confirmed") ? "메일 확인이 아직 안 됐어요. 메일의 링크를 눌러 주세요." :
      msg,
    );
  } finally { $("authSubmit").disabled = false; }
}

async function forgotPassword() {
  const email = $("email").value.trim();
  if (!validEmail(email)) return setAuthMsg("재설정 메일을 받을 이메일을 먼저 적어 주세요.");
  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
    if (error) throw error;
    setAuthMsg("비밀번호 재설정 메일을 보냈어요.", true);
  } catch (e) { setAuthMsg(e.message); }
}
async function openTarget(target) {
  if (!target) return false;
  const [app, id] = target.split(":");
  if (!SCREENS[app]) return false;
  await openApp(app);
  if (app === "events" && id) await editEvent(Number(id));
  return true;
}
async function enter() {
  const me = await api("/api/me");
  if (!me.name) { show("naming"); $("nameInput").focus(); return; }
  agentName = me.name; document.title = me.name;
  const target = new URLSearchParams(location.search).get("open");
  history.replaceState(null, "", location.pathname);
  cache.warm();                            // 모든 앱 데이터를 한 번에 데운다 (기다리지 않는다)
  await goHome();
  if (target) { history.replaceState(null, "", location.pathname); await openTarget(target); }
  // 알림 서비스 워커가 있으면 연결해 두고, 알림을 누르면 화면을 바꾼다
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
    navigator.serviceWorker.addEventListener("message", (e) => {
      if (e.data?.type === "open") openTarget(new URL(e.data.url).searchParams.get("open"));
    });
  }
}
$("nameInput").addEventListener("input", (e) => {
  const v = e.target.value.trim(); $("saveName").disabled = !v;
  e.target.style.width = Math.max(3, Math.min(12, v.length + 1.5)) + "em";
});
$("saveName").addEventListener("click", async () => {
  try { const { name } = await post("/api/name", { name: $("nameInput").value.trim() }); agentName = name; await goHome(); }
  catch (e) { $("nameMsg").textContent = e.message; }
});

/* ===================== 시작 ===================== */
(async () => {
  let cfg;
  try {
    const r = await fetch("/api/config"); const raw = await r.text();
    if (!r.ok) throw new Error(`/api/config 가 ${r.status} 를 돌려줬어요.\n${raw.slice(0, 300)}`);
    cfg = JSON.parse(raw);
  } catch (e) { return fail("서버에 연결하지 못했어요", e.message + "\n\nVercel 대시보드의 Logs 에서 api/index 오류를 확인해 주세요."); }
  if (!cfg.supabase_url || !cfg.anon_key) return fail("설정이 비어 있어요", "Vercel 환경변수 SUPABASE_URL, SUPABASE_ANON_KEY 를 넣고 다시 배포(Redeploy)해 주세요.");
  if (!window.supabase) return fail("로그인 도구를 불러오지 못했어요", "네트워크를 확인하고 새로고침해 주세요.");
  sb = window.supabase.createClient(cfg.supabase_url, cfg.anon_key);
  $("tabLogin").onclick = () => setAuthMode("login");
  $("tabSignup").onclick = () => setAuthMode("signup");
  $("authForm").addEventListener("submit", (e) => { e.preventDefault(); submitAuth(); });
  $("forgot").onclick = forgotPassword;
  $("pwEye").onclick = () => {
    const on = $("pw").type === "password";
    $("pw").type = on ? "text" : "password";
    $("pwEye").textContent = on ? "숨기기" : "보기";
  };
  setAuthMode("login");

  // 비밀번호 재설정 메일의 링크로 돌아온 경우: 새 비밀번호를 정하게 한다
  sb.auth.onAuthStateChange(async (event) => {
    if (event === "PASSWORD_RECOVERY") {
      show("auth");
      const np = prompt("새 비밀번호를 정해 주세요 (6자 이상)");
      if (np && np.length >= 6) {
        const { error } = await sb.auth.updateUser({ password: np });
        if (error) setAuthMsg(error.message);
        else { setAuthMsg("비밀번호를 바꿨어요. 이제 로그인돼요.", true); await enter().catch(() => {}); }
      }
    }
  });

  const { data } = await sb.auth.getSession();
  if (!data.session) return show("auth");
  try { await enter(); } catch (e) { fail("비서를 불러오지 못했어요", e.message); }
})();
</script>
