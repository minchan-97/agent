          if (!(await askConfirm(`'${g.label}'을(를) 지우고 처음부터 다시 맞춰 갈까요?`, "지우기", true))) return;
          await post("/api/memory/reset", { key: g.key }); await render();
        }));
        d.append(row); nodes.push(d);
      }
      if (m.persona !== undefined) {
        const d = el("div", "card mem persona"); d.append(el("div", "s", "✦ 지금까지 자란 나다움 (몰랑이의 자식)"), el("div", "b", m.persona || "아직 흐릿해요. 함께 지내며 또렷해져요."));
        if (m.persona) {
          const row = el("div", "row");
          row.append(button("나다움 초기화", "ghost small", async () => {
            if (!(await askConfirm("자란 나다움을 지우면 처음부터 다시 자라요. 되돌릴 수 없어요.", "초기화", true))) return;
            await post("/api/memory/reset", { key: "persona" }); await render();
          }));
          d.append(row);
        }
        nodes.push(d);
      }
    }

    const all = button("전부 잊게 하기", "danger", async () => {
      if (!(await askConfirm("비서가 나에 대해 아는 것과 맞춰 온 방식을 모두 지울까요?\n일정·메모·대화 같은 내 기록은 남아요.", "모두 잊기", true))) return;
      await post("/api/memory/forget-all"); toast("모두 잊었어요."); await render();
    });
    all.style.marginTop = "22px"; nodes.push(all);
    body.replaceChildren(...nodes);
  },
  add: () => editFact(null),
};
function editFact(f) {
  openSheet(f ? "고치기" : "직접 알려 주기", (s) => {
    const t = input("textarea", f ? f.text : "", { placeholder: "예) 나는 초등학교 영어·도덕 전담 교사야" });
    t.style.minHeight = "90px";
    s.append(field("내용", t), el("p", "muted", "내가 쓴 문장은 바로 확실한 사실이 돼요."));
    const foot = el("div", "actions");
    foot.append(el("span"), button("저장", "", async () => {
      if (f) await post(`/api/memory/facts/${f.id}/update`, { text: t.value });
      else await post("/api/memory/facts/new", { text: t.value });
      closeSheet(); toast("기억했어요."); await render();
    }));
    s.append(foot); setTimeout(() => t.focus(), 50);
  });
}

/* ===================== 채팅 ===================== */
const OPEN_LINK = { event_id: ["events", "일정 보기"], reminder_id: ["reminders", "알림 보기"], memory_id: ["notes", "메모 보기"], task_id: ["tasks", "맡은 일 보기"], skill_id: ["skills", "기능 보기"] };
SCREENS.chat = {
  cacheKey: "history",
  async render(body, data) {
    const log = el("div", "log"); log.id = "log"; body.replaceChildren(log);
    const { items } = data || await cache.get("history");
    if (!items.length) {
      const box = el("div", "empty-state", `${agentName}에게 편하게 말해 보세요.\n일정·알림·메모로 남길 일은 각 앱에 저장되고,\n처음 하는 일은 먼저 물어봐요.`);
      const ex = el("div", "examples");
      for (const t of ["내일 오후 3시 회의 일정 넣고 30분 전에 알려 줘",
                       "이번 주 금요일까지 할 일 정리해 줘",
                       "학부모 안내문 초안 써 줘"]) {
        const b = el("button", "", t); b.onclick = () => { $("text").value = t; $("text").focus(); };
        ex.append(b);
      }
      box.append(ex); log.append(box);
    }
    for (const m of items) bubble(m.role === "user" ? "user" : "agent", m.text);
  },
};
function bubble(role, text, extra = "") {
  const log = $("log"); log.querySelector(".empty-state")?.remove();
  const b = el("div", `bubble ${role} new ${extra}`, text); log.append(b);
  $("screenBody").scrollTop = $("screenBody").scrollHeight; return b;
}
function suggestChips(suggest, target = null) {
  if (!suggest || !suggest.length) return;
  const wrap = el("div", "links");
  for (const sg of suggest) {
    const c = el("button", "suggest");
    c.textContent = "+ " + (sg.label || sg.kind);
    c.onclick = async () => {
      c.disabled = true;
      try {
        const r = await post("/api/suggest/accept", { kind: sg.kind, label: sg.label || "", args: sg.args || {} });
        if (r?.goal !== undefined && r?.id) driveTask(r.id);        // 제안이 과제로 맡겨졌으면 바로 시작
        c.textContent = "✓ " + (sg.label || "완료");
        c.classList.add("done");
        if (r?.status === "proposed") { c.textContent = "확인함에서 결정하기"; c.onclick = () => openApp("inbox"); c.disabled = false; c.classList.remove("done"); }
        else if (r?.id && r?.goal !== undefined) { c.textContent = "✓ 맡은 일로"; c.onclick = () => openApp("tasks"); c.disabled = false; }
      } catch (e) { c.disabled = false; toast(e.message, "err"); }
    };
    wrap.append(c);
  }
  if (target) { target.append(wrap); return; }
  $("log").append(wrap); $("screenBody").scrollTop = $("screenBody").scrollHeight;
}
function linkChips(actions, target = null) {
  const wrap = el("div", "links");
  for (const a of actions) {
    if (a.status === "proposed") { const c = el("button", "", "확인함에서 결정하기"); c.onclick = () => openApp("inbox"); wrap.append(c); continue; }
    for (const [k, [app, label]] of Object.entries(OPEN_LINK)) {
      if (a.result?.[k] != null) {
        const appKey = a.kind === "draft" ? "drafts" : app;
        const c = el("button", "", a.kind === "draft" ? "초안 보기" : label);
        c.onclick = () => openApp(appKey).then(() => (appKey === "events" ? editEvent(a.result.event_id) : null));
        wrap.append(c);
      }
    }
  }
  if (!wrap.children.length) return;
  if (target) { target.append(wrap); return; }
  $("log").append(wrap); $("screenBody").scrollTop = $("screenBody").scrollHeight;
}
$("compose").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("text").value.trim(); if (!text) return;
  $("text").value = ""; $("send").disabled = true;
  bubble("user", text); const wait = bubble("agent", "", "thinking");
  wait.setAttribute("aria-label", "생각하는 중"); wait.append(el("i"), el("i"), el("i"));
  try {
    const res = await post("/api/chat", { text });
    // 대화에서 과제를 맡았으면 크론을 기다리지 않고 바로 시작
    for (const a of res.actions || []) if (a.result?.task_id) driveTask(a.result.task_id);
    wait.classList.remove("thinking"); wait.removeAttribute("aria-label"); wait.textContent = res.reply;
    linkChips(res.actions || []);
    suggestChips(res.suggest || []);
  } catch (err) {
    wait.classList.remove("thinking"); wait.textContent = err.message;
    $("text").value = $("text").value || text;     // 실패하면 보낸 말을 되살려 다시 보낼 수 있게
  }
  finally { $("send").disabled = false; $("text").focus(); }
});
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("compose").requestSubmit(); }
});
/* ---------- 음성 입력 (브라우저 내장, 외부 API 없음) ---------- */
(function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;                     // 지원 안 하는 기기면 버튼을 숨긴 채 둔다
  const mic = $("mic"); if (!mic) return;
  mic.hidden = false;
  let rec = null, listening = false, base = "";
  mic.addEventListener("click", () => {
    if (listening) { rec && rec.stop(); return; }
    rec = new SR();
    rec.lang = "ko-KR"; rec.interimResults = true; rec.continuous = false;
    base = $("text").value ? $("text").value + " " : "";
    rec.onstart = () => { listening = true; mic.classList.add("on"); };
    rec.onresult = (e) => {
      let txt = "";
      for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      $("text").value = base + txt;
    };
    rec.onerror = (e) => { if (e.error === "not-allowed") toast("마이크 권한을 허용해 주세요."); };
    rec.onend = () => { listening = false; mic.classList.remove("on"); $("text").focus(); };
    try { rec.start(); } catch { /* 이미 돌고 있으면 무시 */ }
  });
})();

async function runInChat(message) {
  await openApp("chat");
  $("text").value = message;
  $("compose").requestSubmit();
}

/* ===================== 로그인·회원가입 ===================== */
let authMode = "login";
function setAuthMode(m) {
  authMode = m;
  $("tabLogin").classList.toggle("on", m === "login");
  $("tabSignup").classList.toggle("on", m === "signup");
  $("pw2Field").hidden = m !== "signup";
  $("consentField").hidden = m !== "signup";
  $("pw").setAttribute("autocomplete", m === "signup" ? "new-password" : "current-password");
  $("authSubmit").textContent = m === "signup" ? "회원가입" : "로그인";
  setAuthMsg("");
}
function setAuthMsg(text, ok = false) {
  const m = $("authMsg"); m.textContent = text; m.classList.toggle("ok", ok);
}
function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

async function submitAuth() {
  const email = $("email").value.trim();
  const password = $("pw").value;
  $("email").classList.toggle("bad", !!email && !validEmail(email));
  if (!validEmail(email)) return setAuthMsg("이메일 형식을 확인해 주세요.");
  if (password.length < 6) return setAuthMsg("비밀번호는 6자 이상이어야 해요.");
  if (authMode === "signup" && password !== $("pw2").value) return setAuthMsg("비밀번호가 서로 달라요.");
  if (authMode === "signup" && !$("consent").checked) return setAuthMsg("이용약관과 개인정보처리방침에 동의해 주세요.");

  $("authSubmit").disabled = true;
  setAuthMsg(authMode === "signup" ? "계정을 만드는 중…" : "로그인 중…");
  try {
    if (authMode === "signup") {
      const { data, error } = await sb.auth.signUp({
        email, password, options: { emailRedirectTo: location.origin },
      });
      if (error) throw error;
      if (!data.session) {   // 확인 메일 방식
        setAuthMsg("확인 메일을 보냈어요. 메일의 링크를 누르면 바로 시작돼요. 메일이 안 보이면 스팸함도 확인해 주세요.", true);
        return;
      }
      await enter();         // 확인 메일이 꺼져 있으면 바로 입장
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await enter();
    }
  } catch (e) {
    const msg = e.message || "";
    setAuthMsg(
      msg.includes("Invalid login") ? "이메일이나 비밀번호가 맞지 않아요." :
      msg.includes("already registered") || msg.includes("already been") ? "이미 가입된 이메일이에요. 로그인해 주세요." :
      msg.includes("not confirmed") ? "메일 확인이 아직 안 됐어요. 메일의 링크를 눌러 주세요." :
      msg,
    );
  } finally { $("authSubmit").disabled = false; }
}

async function forgotPassword() {
  const email = $("email").value.trim();
  if (!validEmail(email)) return setAuthMsg("재설정 메일을 받을 이메일을 먼저 적어 주세요.");
  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
    if (error) throw error;
    setAuthMsg("비밀번호 재설정 메일을 보냈어요.", true);
  } catch (e) { setAuthMsg(e.message); }
}
async function openTarget(target) {
  if (!target) return false;
  const [app, id] = target.split(":");
  if (!SCREENS[app]) return false;
  await openApp(app);
  if (app === "events" && id) await editEvent(Number(id));
  return true;
}
async function enter() {
  const me = await api("/api/me");
  if (!me.name) { show("naming"); $("nameInput").focus(); return; }
  agentName = me.name; document.title = me.name;
  const target = new URLSearchParams(location.search).get("open");
  history.replaceState(null, "", location.pathname);
  cache.warm();                            // 모든 앱 데이터를 한 번에 데운다 (기다리지 않는다)
  await goHome();
  if (target) { history.replaceState(null, "", location.pathname); await openTarget(target); }
  // 알림 서비스 워커가 있으면 연결해 두고, 알림을 누르면 화면을 바꾼다
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
    navigator.serviceWorker.addEventListener("message", (e) => {
      if (e.data?.type === "open") openTarget(new URL(e.data.url).searchParams.get("open"));
    });
  }
}
$("nameInput").addEventListener("input", (e) => {
  const v = e.target.value.trim(); $("saveName").disabled = !v;
  e.target.style.width = Math.max(3, Math.min(12, v.length + 1.5)) + "em";
});
$("saveName").addEventListener("click", async () => {
  try { const { name } = await post("/api/name", { name: $("nameInput").value.trim() }); agentName = name; await goHome(); welcome(); }
  catch (e) { $("nameMsg").textContent = e.message; }
});

/* ===================== 첫 사용 안내 ===================== */
function welcome() {
  if (ls("biseo.welcomed")) return;
  openSheet(`${agentName}와(과) 시작하기`, (s) => {
    s.classList.add("welcome");
    const ol = el("ol");
    for (const [b, t] of [
      ["말로 맡기세요", "\u201c내일 3시 회의, 30분 전에 알려 줘\u201d처럼 채팅으로 말하면 일정·알림·메모로 정리돼요."],
      ["처음 하는 일은 먼저 물어봐요", "확인함에서 \u2018하기\u2019를 누르면 해요. 같은 종류를 다섯 번 그대로 승인하면 그다음부턴 묻지 않고 해 두고, 되돌리면 다시 묻기 시작해요."],
      ["남에게 닿는 일은 언제나 물어봐요", "메시지 보내기처럼 되돌릴 수 없는 일은 아무리 써도 혼자 하지 않아요."],
      ["긴 일은 \u2018맡은 일\u2019로", "조사·정리처럼 여러 단계가 필요한 일은 틈틈이 진행하고, 묻거나 끝나면 알려 줘요."],
    ]) { const li = el("li"); li.append(el("b", "", b), el("span", "muted", t)); ol.append(li); }
    s.append(ol);
    const foot = el("div", "actions");
    foot.append(button("나중에", "ghost", async () => { ls("biseo.welcomed", "1"); closeSheet(); }),
      button("알림 켜고 시작", "", async () => {
        ls("biseo.welcomed", "1");
        try { await enablePush(); toast("알림을 켰어요."); } catch (e) { toast(e.message, "err"); }
        closeSheet();
      }));
    s.append(foot);
  });
}

/* ===================== 시작 ===================== */
(async () => {
  let cfg;
  try {
    const r = await fetch("/api/config"); const raw = await r.text();
    if (!r.ok) throw new Error(`/api/config 가 ${r.status} 를 돌려줬어요.\n${raw.slice(0, 300)}`);
    cfg = JSON.parse(raw);
  } catch (e) { return fail("서버에 연결하지 못했어요", e.message + "\n\nVercel 대시보드의 Logs 에서 api/index 오류를 확인해 주세요."); }
  if (!cfg.supabase_url || !cfg.anon_key) return fail("설정이 비어 있어요", "Vercel 환경변수 SUPABASE_URL, SUPABASE_ANON_KEY 를 넣고 다시 배포(Redeploy)해 주세요.");
  if (!window.supabase) return fail("로그인 도구를 불러오지 못했어요", "네트워크를 확인하고 새로고침해 주세요.");
  sb = window.supabase.createClient(cfg.supabase_url, cfg.anon_key);
  $("tabLogin").onclick = () => setAuthMode("login");
  $("tabSignup").onclick = () => setAuthMode("signup");
  $("authForm").addEventListener("submit", (e) => { e.preventDefault(); submitAuth(); });
  $("forgot").onclick = forgotPassword;
  $("pwEye").onclick = () => {
    const on = $("pw").type === "password";
    $("pw").type = on ? "text" : "password";
    $("pwEye").textContent = on ? "숨기기" : "보기";
  };
  setAuthMode("login");

  // 비밀번호 재설정 메일의 링크로 돌아온 경우: 새 비밀번호를 정하게 한다
  sb.auth.onAuthStateChange(async (event) => {
    if (event === "PASSWORD_RECOVERY") {
      show("auth");
      openSheet("새 비밀번호 정하기", (s) => {
        const np = input("password", "", { placeholder: "6자 이상", autocomplete: "new-password" });
        s.append(field("새 비밀번호", np));
        const foot = el("div", "actions");
        foot.append(el("span"), button("바꾸기", "", async () => {
          if (np.value.length < 6) throw new Error("비밀번호는 6자 이상이어야 해요.");
          const { error } = await sb.auth.updateUser({ password: np.value });
          if (error) throw error;
          closeSheet(); toast("비밀번호를 바꿨어요.");
          await enter().catch(() => {});
        }));
        s.append(foot); setTimeout(() => np.focus(), 50);
      });
    }
  });

  const { data } = await sb.auth.getSession();
  if (!data.session) return show("auth");
  try { await enter(); } catch (e) { fail("비서를 불러오지 못했어요", e.message); }
})();
