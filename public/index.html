<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비서</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="비서">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1520" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  /* 아이콘의 남색(#004880)이 중심. 확인 대기만 호박색으로 따로 */
  --bg:#F3F6FA; --surface:#FFFFFF; --ink:#13263A; --muted:#5A6B7D; --line:#D4DDE7;
  --accent:#004880; --accent-ink:#FFFFFF; --wait:#8C5300; --wait-bg:#FFF3E0; --mine:#E2ECF6;
  --tile:#004880; --tile-ink:#FFFFFF; --danger:#B3261E;
  --sans:"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0C1520; --surface:#14202D; --ink:#E3EBF3; --muted:#93A4B6; --line:#253445;
    --accent:#7AB0E0; --accent-ink:#0C1520; --wait:#E8B04A; --wait-bg:#2D2414; --mine:#1A2D42;
    --tile:#1E4E7E; --tile-ink:#EAF3FC; --danger:#F2B8B5; color-scheme: dark; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:480px;margin:0 auto;padding:0 18px;height:100%;display:flex;flex-direction:column}

/* 공통 */
.btn{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field textarea{min-height:120px;resize:vertical}
.msg{min-height:1.4em;color:var(--muted);font-size:.9rem;margin-top:10px;white-space:pre-wrap}

/* 시작·로그인·이름 */
.auth{margin:auto 0;padding:32px 0}
.auth h1{font-size:1.5rem;font-weight:700;margin:0 0 6px}
.auth p{color:var(--muted);margin:0 0 24px;white-space:pre-wrap}
.brand{text-align:center;margin:8px 0 26px}
.brand-mark{width:72px;height:72px;margin:0 auto 14px;border-radius:20px;overflow:hidden;box-shadow:0 2px 10px rgb(0 0 0 / .1)}
.brand-mark img{width:100%;height:100%;display:block}
.brand h1{font-size:1.6rem;font-weight:800;margin:0 0 6px;color:var(--accent)}
.brand .tagline{color:var(--muted);margin:0}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.tab{flex:1;border:0;background:none;color:var(--muted);font-weight:600;padding:9px;border-radius:9px;cursor:pointer}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.pw-wrap{display:flex;gap:8px}
.pw-wrap input{flex:1;min-width:0}
.pw-eye{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;color:var(--muted);cursor:pointer;font-size:.85rem}
.btn.block{width:100%;padding:13px;margin-top:4px;font-size:1.02rem}
.linklike{display:block;margin:14px auto 0;background:none;border:0;color:var(--accent);cursor:pointer;font-size:.9rem}
.fineprint{color:var(--muted);font-size:.78rem;text-align:center;margin-top:22px;line-height:1.5}
.field input.bad{border-color:var(--danger)}
.msg.ok{color:var(--accent)}
.naming{margin:auto 0;padding:40px 0}
.naming .lead{color:var(--muted);margin:0 0 28px}
.naming .say{font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.35;margin:0;font-weight:500}
.naming .say input{font-weight:800;color:var(--accent);background:transparent;border:0;border-bottom:2px solid var(--accent);width:6.5em;text-align:center}
.naming .say input::placeholder{color:var(--line)}
.naming .note{color:var(--muted);font-size:.9rem;margin:20px 0 28px}

/* 홈 화면 */
.home{padding:20px 0 28px;overflow-y:auto;height:100%}
.home .date{color:var(--muted);font-size:.95rem}
.home h1{font-size:2rem;font-weight:800;margin:2px 0 18px;color:var(--accent);letter-spacing:-.01em}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:22px}
.widget h2{font-size:.9rem;font-weight:700;margin:0 0 8px;color:var(--muted)}
.widget .ev{display:flex;gap:10px;padding:4px 0;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.widget .ev b{font-variant-numeric:tabular-nums;min-width:3.4em;color:var(--accent)}
.widget .empty{color:var(--muted);font-size:.92rem}
.widget .next{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:.92rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:0;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--wait-bg);color:var(--wait)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0;position:relative}
.app-icon .tile{width:62px;height:62px;border-radius:17px;background:var(--tile);color:var(--tile-ink);display:grid;place-items:center;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.pin-tile svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-icon .tile svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-icon span{font-size:.8rem}
.badge{position:absolute;top:-5px;right:calc(50% - 38px);min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--wait);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center}

/* 앱 화면 */
.screen{display:flex;flex-direction:column;height:100%}
.screen header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.screen header h1{font-size:1.15rem;font-weight:700;margin:0;flex:1;text-align:center}
.back,.add{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 4px;min-width:64px}
.add{text-align:right;font-size:1.5rem;line-height:1}
.back{text-align:left}
.body{flex:1;overflow-y:auto;padding:12px 0 18px}
.group{font-size:.82rem;font-weight:700;color:var(--muted);margin:14px 0 6px}
.group:first-child{margin-top:0}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:.86rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:pre-wrap}
.item.wait{background:var(--wait-bg);border-color:transparent;border-left:3px solid var(--wait);cursor:default}
.empty-state{color:var(--muted);text-align:center;padding:40px 10px;white-space:pre-wrap}
.toggle{margin-bottom:10px}
.actionbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.actionbar input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.shortcuts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sc{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:.9rem;font-weight:600}
.sc .mini{width:16px;height:16px;display:inline-grid;place-items:center}
.sc .mini svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sc.add{color:var(--muted);font-weight:500;border-style:dashed}
.sc .x{color:var(--muted);margin-left:2px;font-weight:400}
.item .lead{display:flex;align-items:center;gap:10px}
.item .lead .mini{width:22px;height:22px;flex:none;display:inline-grid;place-items:center}
.item .lead .mini svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card .lead{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.card .lead .mini{width:20px;height:20px;flex:none;display:inline-grid;place-items:center}
.card .lead .mini svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* 채팅 */
.log{flex:1;overflow-y:auto;padding:14px 0 8px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.bubble.agent{background:var(--surface);align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--line)}
.bubble.user{background:var(--mine);align-self:flex-end;border-bottom-right-radius:4px}
.bubble.thinking{color:var(--muted)}
.links{align-self:flex-start;display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
.links button{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:.82rem;cursor:pointer}
.links button.suggest{border-color:var(--accent);font-weight:600}
.links button.suggest.done{border-color:var(--line);color:var(--muted);font-weight:400}
.links button:disabled{opacity:.6;cursor:default}
form.compose{display:flex;gap:8px;padding:10px 0 14px;border-top:1px solid var(--line)}
form.compose textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);max-height:140px}
.mic{flex:none;width:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-size:1.2rem;line-height:1}
.mic.on{background:var(--accent);border-color:var(--accent);animation:micpulse 1s infinite}
@keyframes micpulse{0%,100%{opacity:1}50%{opacity:.55}}

/* 맡은 일·확인함 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px 14px 14px 4px;padding:11px 14px;margin-bottom:8px}
.card.ask,.card.wait{background:var(--wait-bg);border-color:transparent;border-left-color:var(--wait)}
.card.ended{border-left-color:var(--line)}
.card .t{font-weight:600}
.card .s{color:var(--muted);font-size:.85rem}
.card .b{margin:4px 0 8px;white-space:pre-wrap}
.card .row input{flex:1 1 100%;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

/* 시트(편집 창) */
dialog.sheet{border:0;border-radius:20px 20px 0 0;background:var(--bg);color:var(--ink);width:100%;max-width:480px;margin:auto auto 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto}
dialog.sheet::backdrop{background:rgb(0 0 0 / .35)}
.sheet h2{font-size:1.1rem;margin:0 0 14px}
.sheet .sub{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.sheet .sub h3{font-size:.9rem;margin:0 0 8px;color:var(--muted)}
.linked{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:.92rem}
.linked span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linked button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.85rem}
.sheet .actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
code.topic{display:block;background:var(--surface);border:1px solid var(--line);padding:8px 10px;border-radius:8px;word-break:break-all;margin:8px 0}
/* 로딩 자리표시(스켈레톤): 빈 화면 대신 윤곽을 먼저 보여 준다 */
.skel{background:var(--surface);border:1px solid var(--line);border-radius:14px;height:64px;margin-bottom:8px;overflow:hidden;position:relative}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(127,127,127,.08),transparent);transform:translateX(-100%)}
.app-icon .tile{transition:transform .12s ease, box-shadow .12s ease}
.app-icon:active .tile{transform:scale(.94)}
.item,.card,.sc,.btn{transition:transform .1s ease, opacity .15s ease}
.item:active,.card:active{transform:scale(.99)}
.btn:active,.sc:active{transform:scale(.96)}
@media (prefers-reduced-motion: no-preference){
  .bubble.new{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .screen:not([hidden]) .body > *,.home:not([hidden]) .widget,.home:not([hidden]) .grid{animation:fade .22s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .skel::after{animation:shimmer 1.3s infinite}
  @keyframes shimmer{to{transform:translateX(100%)}}
}
.card .taint{font-size:.8rem;color:var(--wait);margin:-2px 0 8px}

/* 비밀번호 보기: 입력칸 안쪽 오른쪽 (.field span 규칙을 이기도록 두 단계 선택자) */
.field .pw-wrap{display:block;position:relative;margin:0;color:inherit;font-size:inherit}
.field .pw-wrap input{padding-right:64px}
.field .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;padding:6px 8px;color:var(--accent);font-weight:600}

/* 가입 동의 */
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--muted);margin:2px 0 6px;line-height:1.45}
.consent input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent)}
.consent a,.fineprint a,.legal a{color:var(--accent)}

/* 홈 타일: 자주 쓰는 앱은 남색, 관리용 앱은 밝게 → 한눈에 위계가 보이게 */
.app-icon .tile{background:linear-gradient(160deg,#0B5C9E 0%,var(--tile) 70%)}
.app-icon.sys .tile{background:var(--surface);color:var(--accent);border:1px solid var(--line);box-shadow:none}
@media (prefers-color-scheme: dark){ .app-icon .tile{background:linear-gradient(160deg,#2A64A0 0%,var(--tile) 70%)} }

/* 홈: 상황 카드 */
.home{display:flex;flex-direction:column}
.home .grid{margin-bottom:12px}
.ctx{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.ctx h2{font-size:.82rem;font-weight:700;margin:0 0 6px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ctx.soon{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ctx.soon .big{font-size:1.05rem;font-weight:700}
.ctx.plan h2{color:var(--accent)}
.ctx h2 .mini{width:16px;height:16px;display:inline-grid;place-items:center}
.ctx h2 .mini svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctx .greet{margin:0 0 8px}
.sug{border-top:1px solid var(--line);padding:10px 0 2px}
.sug .t{font-weight:600}
.sug .w{color:var(--muted);font-size:.86rem;margin:2px 0 8px}
.sug.done{opacity:.55}
.sug.done .row{display:none}
.ctx.result .you{color:var(--muted);font-size:.88rem;margin:0 0 6px}
.ctx.result .reply{white-space:pre-wrap}
.ctx.result .bubble.thinking{border:0;padding:6px 0;background:none}
.ctx .x{float:right;background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:0 2px}
.ainote{font-size:.86rem;color:var(--muted);margin:-4px 0 14px;display:flex;gap:6px}
.ainote b{color:var(--accent)}
/* 비서가 만든 타일: 반짝 표시 */
.app-icon.ai .tile{position:relative}
.app-icon.ai .tile::after{content:"✦";position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;
  background:var(--surface);color:var(--accent);font-size:11px;display:grid;place-items:center;border:1px solid var(--line)}
/* 홈 아래 입력줄 */
form.homebar{position:sticky;bottom:0;margin-top:auto;display:flex;gap:8px;padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,var(--bg) 22%)}
form.homebar textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:var(--surface);max-height:120px;box-shadow:0 2px 10px rgb(0 0 0 / .06)}
form.homebar .btn{border-radius:14px}

/* 지금 진행 중인 과제 */
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
@media (prefers-reduced-motion: no-preference){ .live-dot{animation:blink 1.2s infinite} .card.running .progress i{background-image:linear-gradient(90deg,var(--accent),#3D8BD0,var(--accent));background-size:200% 100%;animation:flow 1.4s linear infinite} @keyframes flow{to{background-position:-200% 0}} }

/* 과제 진행 막대 */
.progress{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}

/* 생각 중 점 세 개 */
.bubble.thinking{display:inline-flex;gap:4px;align-items:center;min-height:42px}
.bubble.thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.4}
@media (prefers-reduced-motion: no-preference){
  .bubble.thinking i{animation:blink 1.2s infinite}
  .bubble.thinking i:nth-child(2){animation-delay:.2s} .bubble.thinking i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
}

/* 채팅 첫 화면 예시 */
.examples{display:flex;flex-direction:column;gap:8px;margin:18px auto 0;max-width:340px}
.examples button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;text-align:left;cursor:pointer;color:var(--ink)}
.examples button:active{transform:scale(.98)}

/* 토스트 (브라우저 alert 대신) */
.toasts{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50;padding:0 18px}
.toast{max-width:440px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:.92rem;box-shadow:0 6px 20px rgb(0 0 0 / .18);white-space:pre-wrap;pointer-events:auto}
.toast.err{background:var(--danger);color:#fff}
@media (prefers-color-scheme: dark){ .toast.err{color:#3B0A08} }
@media (prefers-reduced-motion: no-preference){ .toast{animation:rise .18s ease-out} }

/* 확인 창 (브라우저 confirm 대신) */
dialog.ask{border:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(340px,calc(100% - 36px));padding:20px}
dialog.ask::backdrop{background:rgb(0 0 0 / .35)}
dialog.ask p{margin:0 0 18px;white-space:pre-wrap}
dialog.ask .row{justify-content:flex-end}

/* 첫 사용 안내 */
.welcome ol{padding-left:1.2em;margin:0 0 14px}
.welcome li{margin-bottom:10px}
.welcome li b{display:block}
.legal{font-size:.82rem;color:var(--muted);margin-top:26px;display:flex;gap:14px;flex-wrap:wrap}
.body .sub{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.body .sub h3{font-size:.9rem;margin:0 0 8px;color:var(--muted)}
details.adv summary{cursor:pointer;color:var(--muted);font-size:.9rem;margin:6px 0}

/* ===================== C · 위젯 벤토 테마 =====================
   테두리 대신 여백과 옅은 그림자, 진한 색은 '지금 가장 중요한 것' 하나에만. */
:root{ --bg:#ECF0F5; --surface:#FFFFFF; --ink:#0E1A2B; --muted:#56616F; --line:#E3E8EE;
  --accent:#0B4F8A; --accent-ink:#FFFFFF; --hero:#0B4F8A; --hero-ink:#FFFFFF; --hero-sub:#CFE0F2;
  --amber-bg:#FFF1DE; --amber-ink:#5A3300; --soft:#F1F4F8; --live:#1F9D6A;
  --shadow:0 1px 2px rgb(14 26 43 / .05), 0 6px 18px rgb(14 26 43 / .06); }
@media (prefers-color-scheme: dark){
  :root{ --bg:#0B121B; --surface:#141E2A; --ink:#E6EDF5; --muted:#97A6B8; --line:#223143;
    --accent:#7AB0E0; --accent-ink:#0B121B; --hero:#1D578F; --hero-ink:#FFFFFF; --hero-sub:#C9DDF1;
    --amber-bg:#3A2A12; --amber-ink:#F6DDB2; --soft:#1B2735; --live:#3DDC97;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 22px rgb(0 0 0 / .25); }
}
body{background:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 공통 부품: 테두리 없는 카드, 알약 버튼 */
.card,.item,.widget{border:0!important;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.card{padding:14px 16px}
.card.ask,.card.wait,.item.wait{background:var(--amber-bg);box-shadow:none;border-left:0!important}
.card.ended{opacity:.7;box-shadow:none}
.btn{border-radius:999px;font-weight:600}
.btn.ghost{background:var(--soft);border:0;color:var(--ink)}
.btn.danger{background:transparent;border:0;color:var(--danger)}
.btn.small{padding:8px 14px;min-height:36px}
.screen header{border-bottom:0;padding:16px 0 8px}
.screen header h1{font-size:1.05rem}
.field input,.field textarea,.field select,.actionbar input,.card .row input{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px}
.sc{border:0;background:var(--surface);box-shadow:var(--shadow)}
.bubble.agent{border:0;box-shadow:var(--shadow)}
.progress{background:var(--soft)}
dialog.sheet{background:var(--bg);border-radius:26px 26px 0 0}

/* 홈 */
.home{padding:22px 0 0;display:flex;flex-direction:column;height:100%;overflow-y:auto}
.hhead{display:flex;justify-content:space-between;align-items:center;padding:0 4px 14px}
.hhead .date{font-size:.82rem;font-weight:500;color:var(--muted)}
.hhead h1{font-size:1.65rem;font-weight:800;letter-spacing:-.03em;margin:0;color:var(--ink)}
.avatar{width:44px;height:44px;border-radius:22px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;cursor:pointer}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:16px}
.bento .w2{grid-column:span 2}
.bt{border:0;text-align:left;font:inherit;color:var(--ink);border-radius:26px;padding:16px 18px;cursor:pointer;display:flex}
.bt.card-w{background:var(--surface);box-shadow:var(--shadow)}
/* 큰 남색 카드: 지금 가장 중요한 한 가지 */
.bt.hero{background:var(--hero);color:var(--hero-ink);justify-content:space-between;align-items:flex-end;min-height:128px;gap:12px}
.hero .hl{display:flex;flex-direction:column;gap:3px;min-width:0}
.hero .k{font-size:.75rem;font-weight:600;letter-spacing:.04em;color:var(--hero-sub)}
.hero .t{font-size:1.2rem;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.hero .m{font-size:.82rem;color:var(--hero-sub)}
.hero .hr{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.hero .n{font-size:2.9rem;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.hero .n.sm{font-size:2rem}
.hero .u{font-size:.8rem;font-weight:600;color:var(--hero-sub)}
/* 오늘 하면 좋을 것 */
.bt.plan{flex-direction:column;cursor:default;padding:16px 18px 8px}
.plan .ph{display:flex;align-items:center;gap:8px;padding-bottom:6px}
.plan .pi{width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.plan .pi svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.plan .pt{font-size:.9rem;font-weight:700}
.plan .pc{margin-left:auto;font-size:.75rem;color:var(--muted)}
.plan .pe{color:var(--muted);font-size:.88rem;margin:2px 0 12px}
.plan .pr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.plan .pr.done{opacity:.55}
.plan .px{flex:1;min-width:0;display:flex;flex-direction:column}
.plan .pxt{font-size:.94rem;font-weight:600}
.plan .pxw{font-size:.76rem;color:var(--muted)}
.pill{height:36px;min-width:44px;padding:0 14px;border-radius:18px;border:0;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;margin-bottom:8px;align-self:flex-start}
.pill.dark{background:var(--ink);color:var(--surface)}
.plan .pr .pill{margin:0}
.iconbtn{width:36px;height:36px;border-radius:18px;border:0;background:var(--soft);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
/* 작은 카드 */
.bt.small{flex-direction:column;justify-content:space-between;min-height:112px}
.bt.small.amber{background:var(--amber-bg);color:var(--amber-ink)}
.small .sk{font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:6px}
.small .sv{display:flex;align-items:baseline;gap:6px}
.small .sv.col{flex-direction:column;align-items:stretch;gap:6px}
.small .n{font-size:2.2rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.small .u{font-size:.75rem;font-weight:600}
.small .tt{font-size:.82rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.small .bar{display:block;height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
.small .bar i{display:block;height:5px;background:var(--live);border-radius:3px}
.dot{width:7px;height:7px;border-radius:4px;display:inline-block}
.dot.live{background:var(--live)}
.dot.wait{background:#B25E00}
@media (prefers-reduced-motion: no-preference){ .dot.live{animation:blink 1.4s infinite} }
.ainote{border:0;background:none;font:inherit;font-size:.84rem;color:var(--muted);display:flex;gap:6px;cursor:pointer;padding:0 6px;text-align:left}
.ainote b{color:var(--accent)}
/* 홈 입력줄 결과 카드 */
.bt.result{flex-direction:column;cursor:default;position:relative}
.result .you{color:var(--muted);font-size:.84rem;margin:0 36px 6px 0}
.result .reply{white-space:pre-wrap}
.result .x{position:absolute;top:10px;right:10px}
.result .bubble.thinking{box-shadow:none;padding:4px 0;background:none}
/* 아래: 입력줄 + 독 */
.homefoot{position:sticky;bottom:0;margin-top:auto;padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:linear-gradient(rgb(236 240 245 / 0),var(--bg) 26%)}
@media (prefers-color-scheme: dark){ .homefoot{background:linear-gradient(rgb(11 18 27 / 0),var(--bg) 26%)} }
form.homebar{position:static;display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 4px 4px 18px;border-radius:26px;background:var(--surface);box-shadow:0 1px 2px rgb(14 26 43 / .05),0 8px 22px rgb(14 26 43 / .10);margin:0}
form.homebar textarea{flex:1;border:0;box-shadow:none;background:transparent;padding:10px 0;resize:none;outline:none;max-height:110px}
form.homebar .send{width:44px;height:44px;border-radius:22px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
form.homebar .send svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dock{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px;border-radius:28px;background:rgb(255 255 255 / .72);box-shadow:inset 0 0 0 1px rgb(14 26 43 / .06);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
@media (prefers-color-scheme: dark){ .dock{background:rgb(20 30 42 / .8);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .06)} }
.dock button{height:52px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink);position:relative;border-radius:22px}
.dock button:active{background:var(--soft)}
.dock svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dock .badge{top:6px;right:calc(50% - 22px)}
/* 모든 앱 시트 */
.sheet .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 8px;padding:6px 0 10px}
.sheet .app-icon .tile{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.sheet .app-icon .tile.accent{background:var(--accent);color:var(--accent-ink)}
.sheet .app-icon span{color:var(--ink)}
/* 채팅 입력줄도 홈과 같은 알약 모양 */
form.compose{border-top:0;align-items:center;gap:6px;margin:6px 0 calc(12px + env(safe-area-inset-bottom,0px));padding:4px 4px 4px 6px;border-radius:26px;background:var(--surface);box-shadow:0 1px 2px rgb(14 26 43 / .05),0 8px 22px rgb(14 26 43 / .10)}
form.compose textarea{border:0;box-shadow:none;background:transparent;outline:none;padding:10px 4px}
form.compose .mic{width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:var(--muted);display:grid;place-items:center}
form.compose .mic.on{background:var(--accent);color:var(--accent-ink)}
form.compose .mic svg,form.compose .send svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
form.compose .send{width:44px;height:44px;border-radius:22px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
form.compose .send:disabled{opacity:.5}
/* ===== 위젯 홈: 쪽 넘기기 + 편집 ===== */
.home{overflow:hidden!important;padding-top:14px}
.hhead{padding-bottom:10px}
.pager{flex:1 1 auto;min-height:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.page{height:100%;overflow-y:auto;scrollbar-width:none;overscroll-behavior-y:contain}
.page::-webkit-scrollbar{display:none}
.homefoot{position:static;margin-top:0;padding-top:4px;background:none}
/* 위젯을 조금 더 촘촘하게 (작은 폰에서도 기본 6개가 한 화면에) */
.bento{gap:10px}
.bt{padding:14px 16px;border-radius:22px}
.bt.hero{min-height:100px}
.hero .n{font-size:2.4rem}
.hero .n.sm{font-size:1.7rem}
.hero .t{font-size:1.08rem}
.bt.small,.bt.pinw.small{min-height:92px}
.small .n{font-size:1.9rem}
.bt .ai{width:34px;height:34px;border-radius:11px}
.bt .ai svg{width:18px;height:18px}
.bt.plan{padding:12px 16px 4px}
.plan .pr{padding:7px 0}
.plan .pxw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan .pe{margin:2px 0 10px}
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px;padding:0 0 4px;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;box-sizing:border-box;padding:2px 18px 0}
.page .bento{padding-bottom:8px}
.wslot{position:relative;min-width:0;display:flex}
.wslot.w2{grid-column:span 2}
.wslot > .bt{flex:1;min-width:0}
#homeTop .bt{margin-bottom:12px}
.dots{display:flex;justify-content:center;gap:2px;min-height:20px;align-items:center}
.dot-p{width:22px;height:22px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
.dot-p::after{content:"";width:7px;height:7px;border-radius:4px;background:var(--line)}
.dot-p.on::after{background:var(--ink);width:18px}
/* 편집 모드 */
.editbar{display:flex;gap:6px}
.pill.soft{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);margin:0}
.editbar .pill{margin:0}
body.editing .homefoot{display:none}
body.editing .wslot:not(.addslot){touch-action:none;cursor:grab}
body.editing .wslot > .bt{pointer-events:none}
@media (prefers-reduced-motion: no-preference){
  body.editing .wslot:not(.addslot):not(.dragging){animation:jiggle .32s ease-in-out infinite alternate}
  body.editing .wslot:nth-child(2n){animation-delay:-.16s}
  @keyframes jiggle{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
}
.wslot.dragging{z-index:20;cursor:grabbing;filter:drop-shadow(0 14px 24px rgb(14 26 43 / .22))}
.wctl{position:absolute;z-index:3;border:0;cursor:pointer;font:inherit}
.wctl.rm{top:6px;left:6px;width:28px;height:28px;border-radius:14px;background:#C0392B;color:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgb(0 0 0 / .2)}
.wctl.rm::before{content:"";position:absolute;inset:-8px}
.wctl.rm svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round}
.wctl.sz{top:6px;right:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--ink);color:var(--surface);font-size:.72rem;font-weight:700;box-shadow:0 2px 6px rgb(0 0 0 / .2)}
body.editing .page{padding-top:4px}
body.editing .wslot > .bt{opacity:.92}
.addslot{border:2px dashed var(--line);border-radius:26px;background:transparent;color:var(--muted);font:inherit;font-weight:600;min-height:72px;justify-content:center;align-items:center;cursor:pointer}
/* 새 위젯 종류 */
.bt.list{flex-direction:column;gap:6px;cursor:pointer}
.list .lh{font-size:.82rem;font-weight:700;color:var(--muted)}
.list .le{font-size:.86rem;color:var(--muted)}
.list .lt{font-size:1.02rem;font-weight:700}
.list .lr{display:flex;gap:10px;border:0;background:none;font:inherit;color:var(--ink);padding:3px 0;text-align:left;cursor:pointer}
.list .lr b{color:var(--accent);font-variant-numeric:tabular-nums;min-width:4.4em}
.list .ln{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.small .big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.bt .ai{width:40px;height:40px;border-radius:13px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.bt .ai.fill{background:var(--accent);color:var(--accent-ink)}
.bt .ai svg,.pitem .ai svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bt.appw{align-items:flex-start;justify-content:space-between}
.bt.appw .al{font-size:.9rem;font-weight:700}
.bt.pinw.small{flex-direction:column;justify-content:space-between;min-height:112px}
.bt.pinw.wide{align-items:center;gap:12px}
.pinw .pl{display:flex;flex-direction:column;min-width:0}
.pinw .al{font-size:.92rem;font-weight:700}
.pinw .pd{font-size:.74rem;color:var(--muted)}
/* 위젯 고르기 시트 */
.picker .ph3{font-size:.8rem;color:var(--muted);margin:16px 2px 8px;font-weight:700}
.picker .ph3:first-of-type{margin-top:4px}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:12px;border:0;background:var(--surface);border-radius:16px;padding:10px 12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);min-height:60px}
.pitem .ai{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.pitem .pt{flex:1;min-width:0;display:flex;flex-direction:column}
.pitem .pn{font-weight:600;font-size:.94rem}
.pitem .pd{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pp{width:30px;height:30px;border-radius:15px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.pempty{color:var(--muted);font-size:.86rem;white-space:pre-wrap;margin:0 2px}
/* 빈 카드는 조용히, 지난 결과 */
.bt.small.quiet{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.small .ok{font-size:.88rem;font-weight:600;color:var(--muted)}
.pinw .pd{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;margin-top:2px}
.pinw .pd .dot{vertical-align:1px}
.lastrun{display:flex;flex-direction:column;gap:4px;background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.lastrun .lk{font-size:.76rem;color:var(--muted);font-weight:600}
.lastrun .lv{font-size:.92rem}
.lastrun .btn{align-self:flex-start;margin-top:6px}
.field select{width:100%;padding:10px 12px;border:0;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
/* 기억 화면 */
.memintro{color:var(--muted);font-size:.88rem;margin:4px 2px 6px}
.memhint{font-size:.8rem;margin:-2px 2px 8px}
.card.mem .b{margin:0 0 2px;font-weight:600}
.card.mem .s{margin-bottom:8px}
.card.mem.unsure{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.card.mem.persona .s{color:var(--accent);font-weight:700}
.card.mem.persona .b{font-weight:400;white-space:pre-wrap}
.whybtn{display:inline-flex;align-self:flex-start;border:0;background:none;padding:2px 0;margin-top:2px;font:inherit;font-size:.74rem;font-weight:600;color:var(--accent);opacity:.85;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.whybtn:active{opacity:.5}
.why-sum{font-size:.98rem;line-height:1.5;margin:0 0 4px}
.why-path{margin:0;padding:0;list-style:none;counter-reset:wp}
.why-path li{counter-increment:wp;position:relative;padding:8px 0 8px 30px;border-left:2px solid var(--line);margin-left:10px}
.why-path li::before{content:counter(wp);position:absolute;left:-11px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:.7rem;display:grid;place-items:center;color:var(--muted)}
.why-path li.grown::before{content:"✦";background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.why-path .wp{display:block;font-size:.9rem}
.why-path .wm,.why-rc .wm{display:block;font-size:.74rem;color:var(--muted);margin-top:2px}
.why-path li.grown .wm{color:var(--accent)}
.why-ev{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 10px;margin:0 0 6px;font:inherit;font-size:.86rem}
.why-ev.go{cursor:pointer}.why-ev.go::after{content:"›";margin-left:auto;color:var(--muted)}
.why-ev .wk{flex:none;font-size:.72rem;font-weight:700;color:var(--accent)}
.why-ev .wt{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.why-rc{padding:8px 0;border-bottom:1px dashed var(--line);font-size:.86rem}
.why-fb{margin:16px 0 0;font-size:.84rem;padding:10px 12px;border-radius:12px;background:var(--surface);color:var(--muted)}
.why-fb.ok{color:var(--ink)}.why-fb.no{opacity:.8}
.muted.small{font-size:.76rem}
</style>

<body>
<div class="wrap">

  <section class="auth" id="boot">
    <h1>불러오는 중</h1>

  </section>

  <section class="auth" id="auth" hidden>
    <div class="brand">
      <div class="brand-mark"><img src="/icon-192.png" alt=""></div>
      <h1>나만의 비서</h1>
      <p class="tagline">일정·메모·할 일을 맡기면, 알아서 챙겨 주는 비서예요.</p>
    </div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let sb, agentName = "", current = null;

/* ---------- 알림말·확인 (브라우저 기본 창 대신) ---------- */
function toast(msg, kind = "") {
  const t = el("div", "toast" + (kind ? " " + kind : ""), String(msg ?? ""));
  $("toasts").append(t);
  setTimeout(() => t.remove(), kind === "err" ? 4200 : 2400);
}
function askConfirm(msg, yes = "확인", danger = false) {
  return new Promise((done) => {
    const d = $("ask"); $("askMsg").textContent = msg;
    const y = $("askYes"); y.textContent = yes; y.className = "btn" + (danger ? " danger" : "");
    const finish = (v) => { d.close(); done(v); };
    y.onclick = () => finish(true); $("askNo").onclick = () => finish(false);
    d.oncancel = (e) => { e.preventDefault(); finish(false); };
    d.showModal();
  });
}
function ls(key, val) {       // 브라우저 저장소는 막혀 있을 수 있다 → 실패해도 앱은 돈다
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch { return null; }
}

/* ---------- 서버 ---------- */
let _token = null;
async function token() {
  if (_token && _token.exp > Date.now() / 1000 + 60) return _token.v;
  const { data } = await sb.auth.getSession();
  const v = data.session?.access_token;
  try { _token = { v, exp: JSON.parse(atob(v.split(".")[1])).exp }; } catch { _token = { v, exp: 0 }; }
  return v;
}
async function api(path, opts = {}) {
  if (!navigator.onLine) throw new Error("인터넷에 연결돼 있지 않아요. 연결되면 다시 해 주세요.");
  let res;
  try {
    res = await fetch(path, {
      ...opts,
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${await token()}`, ...(opts.headers || {}) },
    });
  } catch { throw new Error("서버에 닿지 못했어요. 잠시 뒤 다시 해 주세요."); }
  const body = await res.json().catch(() => ({}));
  if (res.status === 401) {               // 로그인이 풀렸으면 로그인 화면으로
    _token = null; show("auth"); setAuthMsg("다시 로그인해 주세요.");
    throw new Error(body.detail || "로그인이 필요해요");
  }
  if (!res.ok) {
    const extra = body.error_id ? ` (오류 번호 ${body.error_id})` : "";
    throw new Error((body.detail || `요청이 실패했어요 (${res.status})`) + extra);
  }
  return body;
}
/* ---------- 화면 데이터 캐시: 먼저 보여 주고, 뒤에서 갱신 ---------- */
const cache = {
  store: new Map(),
  paths: { home: "/api/home", events: "/api/events", reminders: "/api/reminders",
           notes: "/api/notes", drafts: "/api/drafts", tasks: "/api/tasks",
           actions: "/api/actions", skills: "/api/skills", history: "/api/history" },
  has(k) { return this.store.has(k); },
  peek(k) { return this.store.get(k); },
  async get(k) { return this.store.has(k) ? this.store.get(k) : this.fresh(k); },
  async fresh(k) { const v = await api(this.paths[k]); this.store.set(k, v); return v; },
  drop(...ks) { for (const k of ks) this.store.delete(k); },
  clear() { this.store.clear(); },
  async warm() { await Promise.all(Object.keys(this.paths).map((k) => this.fresh(k).catch(() => {}))); },
};

const CACHE_TOUCH = [
  [/\/api\/(events)\b/, ["events", "home", "reminders", "notes"]],   // 일정은 알림·메모와 얽힘
  [/\/api\/(reminders)\b/, ["reminders", "home"]],
  [/\/api\/(notes)\b/, ["notes"]],
  [/\/api\/(drafts)\b/, ["drafts"]],
  [/\/api\/(tasks)\b/, ["tasks", "home"]],
  [/\/api\/(actions|skills)\b.*\/(approve|reject|undo|run|remove|pin|unpin)/, ["actions", "tasks", "skills", "home", "events", "reminders", "notes", "drafts"]],
  [/\/api\/(shortcuts|search|apps\/[a-z]+\/skills)\b/, ["tasks", "home"]],
  [/\/api\/(chat)\b/, ["history", "actions", "tasks", "home", "events", "reminders", "notes", "drafts", "skills"]],
  [/\/api\/(name)\b/, ["home"]],
  [/\/api\/(daily)\b/, ["home", "tasks", "actions", "reminders", "events", "notes"]],
];
async function post(path, body) {
  const r = await api(path, { method: "POST", body: JSON.stringify(body || {}) });
  for (const [re, keys] of CACHE_TOUCH) if (re.test(path)) cache.drop(...keys);
  return r;
}

/* ---------- 시각 ---------- */
const pad = (n) => String(n).padStart(2, "0");
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
const fromLocalInput = (v) => (v ? new Date(v).toISOString() : null);
const hm = (iso) => new Date(iso).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
const md = (iso) => new Date(iso).toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
const when = (iso) => `${md(iso)} ${hm(iso)}`;
function ago(iso) {
  const t = new Date(iso), m = Math.round((Date.now() - t.getTime()) / 60e3);
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (t >= today) return `${Math.round(m / 60)}시간 전`;
  if (t >= new Date(today.getTime() - 864e5)) return `어제 ${hm(iso)}`;
  return md(iso);
}
const REPEAT = [["", "반복 안 함"], ["daily", "매일"], ["weekdays", "평일마다"], ["weekly", "매주"], ["monthly", "매월"]];
const repeatLabel = (r) => ({ daily: "매일", weekdays: "평일", weekly: "매주", monthly: "매월" })[r] || "";
function repeatSelect(value) {
  const sel = el("select");
  for (const [v, t] of REPEAT) { const o = el("option", "", t); o.value = v; if ((value || "") === v) o.selected = true; sel.append(o); }
  return sel;
}
function inHour(h = 1) { const d = new Date(); d.setMinutes(0, 0, 0); d.setHours(d.getHours() + h); return d.toISOString(); }

/* ---------- 화면 전환 ---------- */
function show(id) {
  for (const s of ["boot", "auth", "naming", "home", "screen"]) $(s).hidden = s !== id;
}
function fail(title, detail) {
  show("boot");
  document.querySelector("#boot h1").textContent = title;
  $("bootMsg").textContent = detail;
}

/* ---------- 아이콘 ---------- */
const ICON = {
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  events: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  notes: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  reminders: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  tasks: '<path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.3 1.3L7.5 4.6M3.5 12l1.3 1.3 2.7-2.7M3.5 18l1.3 1.3 2.7-2.7"/>',
  drafts: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
  skills: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><circle cx="16.5" cy="16.5" r="3.5"/>',
  inbox: '<path d="M4 13l3-8h10l3 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>',
  settings: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  dot: '<circle cx="12" cy="12" r="3.5"/>',
  pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  book: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  bolt: '<path d="M13 3L5 13h5l-1 8 8-10h-5z"/>',
  search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/>',
  memory: '<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/><path d="M18.5 4.5l1 1M20.5 9h-1.4"/>',
};
const TINT = { blue: "#2563EB", indigo: "#4F46E5", amber: "#B45309", green: "#15803D", teal: "#0D9488", rose: "#BE123C" };
function miniIcon(name, tint) {
  const span = el("span", "mini");
  span.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[name] || ICON.dot}</svg>`;
  span.style.color = TINT[tint] || TINT.blue;
  return span;
}
const APPS = [
  ["chat", "채팅"], ["search", "검색"], ["events", "일정"], ["notes", "메모"],
  ["reminders", "알림"], ["tasks", "맡은 일"], ["drafts", "초안"], ["skills", "기능"],
  ["inbox", "확인함"], ["memory", "기억"], ["settings", "설정"],
];

const SYS_APPS = new Set(["skills", "inbox", "settings"]);   // 관리용: 밝은 타일

/* ---------- 홈 ---------- */
async function goHome() {
  current = null;
  show("home");
  paintHeader();
  if (cache.has("home")) {                 // 바로 그리고
    paintHome(cache.peek("home"));
    cache.fresh("home").then((h) => { if (!current) paintHome(h); }).catch(() => {});
  } else {
    paintHome(await cache.get("home").catch(() => ({ events: [], pending: 0, asking: 0 })));
  }
}

/* ---------- 홈 (벤토): 비서가 지금 상황에 맞게 짜 주는 화면 ---------- */
let homeResult = null;          // 홈 입력줄로 방금 맡긴 것의 결과 카드
let lastHome = null;
function greeting() {
  const hr = new Date().getHours();
  return hr < 5 ? "늦은 밤이에요" : hr < 11 ? "좋은 아침이에요" : hr < 17 ? "좋은 오후예요" : hr < 22 ? "좋은 저녁이에요" : "늦은 밤이에요";
}
function paintHeader() {
  const d = new Date();
  $("today").textContent = `${d.toLocaleDateString("ko-KR", { weekday: "long" })} · ${d.toLocaleDateString("ko-KR", { month: "long", day: "numeric" })} · ${agentName}`;
  $("agentName").textContent = greeting();
  $("avatar").textContent = (agentName || "비").slice(0, 1);
}
function soonEvent(h) {
  const now = Date.now();
  return (h.events || []).find((e) => {
    const t = new Date(e.starts_at).getTime();
    return t > now - 5 * 60e3 && t - now <= 60 * 60e3;          // 시작 60분 전 ~ 시작 5분 후
  });
}
function nextEvent(h) {
  const now = Date.now() - 5 * 60e3;
  return (h.events || []).find((e) => new Date(e.starts_at).getTime() >= now);
}
const span2 = (n) => { n.classList.add("w2"); return n; };

// 1. 큰 남색 카드: 지금 가장 중요한 한 가지 (곧 시작 > 다음 일정 > 다음 알림 > 빈 날)
function heroCard(h) {
  const b = span2(el("button", "bt hero"));
  const left = el("span", "hl"), right = el("span", "hr");
  const soon = soonEvent(h), next = nextEvent(h);
  if (soon || next) {
    const e = soon || next;
    const mins = Math.max(0, Math.round((new Date(e.starts_at).getTime() - Date.now()) / 60e3));
    left.append(el("span", "k", soon ? (mins ? "곧 시작" : "지금 시작") : "다음 일정"),
                el("span", "t", e.title), el("span", "m", hm(e.starts_at) + (e.place ? ` · ${e.place}` : "")));
    if (soon) right.append(el("span", "n", String(mins)), el("span", "u", "분 뒤"));
    else right.append(el("span", "n sm", hm(e.starts_at).replace(/^(오전|오후)\s*/, "")),
                      el("span", "u", hm(e.starts_at).startsWith("오후") ? "오후" : "오전"));
    b.onclick = () => openApp("events").then(() => editEvent(e.id));
  } else if (h.task && h.task.status === "open") {
    // 일정이 없는 날엔 지금 비서가 하고 있는 일을 크게 (작은 '진행 중' 카드와 겹치지 않게 표시)
    h._heroTask = true;
    left.append(el("span", "k", "지금 비서가 하는 일"), el("span", "t", h.task.goal),
                el("span", "m", `${h.task.steps}/${h.task.max_steps}단계 진행`));
    right.append(el("span", "n sm", Math.round((h.task.steps / Math.max(1, h.task.max_steps)) * 100) + "%"), el("span", "u", "진행"));
    b.onclick = () => openApp("tasks");
  } else if (h.next_reminder && new Date(h.next_reminder.due_at).toDateString() === new Date().toDateString()) {
    left.append(el("span", "k", "다음 알림"), el("span", "t", h.next_reminder.text), el("span", "m", when(h.next_reminder.due_at)));
    right.append(el("span", "n sm", hm(h.next_reminder.due_at).replace(/^(오전|오후)\s*/, "")), el("span", "u", hm(h.next_reminder.due_at).startsWith("오후") ? "오후" : "오전"));
    b.onclick = () => openApp("reminders");
  } else if (h.tomorrow) {
    left.append(el("span", "k", "내일 첫 일정"), el("span", "t", h.tomorrow.title),
                el("span", "m", hm(h.tomorrow.starts_at) + (h.tomorrow.place ? ` · ${h.tomorrow.place}` : "")));
    right.append(el("span", "n sm", hm(h.tomorrow.starts_at).replace(/^(오전|오후)\s*/, "")), el("span", "u", "내일"));
    b.onclick = () => openApp("events").then(() => editEvent(h.tomorrow.id));
  } else if ((h.daily?.items || []).some((i) => i.state === "new")) {
    const it = h.daily.items.find((i) => i.state === "new");

// 위젯 종류 (서버 biseo/layout.py 의 TYPES 와 같아야 한다)
const WIDGETS = {
  hero:     { name: "지금 가장 중요한 것", desc: "곧 시작할 일정이나 다음 알림을 크게", sizes: ["wide"] },

  task:     { name: "진행 중인 일", desc: "맡긴 일이 어디까지 갔는지", sizes: ["small", "wide"] },
  events:   { name: "오늘 일정", desc: "오늘 남은 일정 목록", sizes: ["wide"] },
  reminder: { name: "다음 알림", desc: "곧 울릴 알림 하나", sizes: ["small", "wide"] },

  app:      { name: "앱 바로가기", desc: "", sizes: ["small"] },
  pin:      { name: "새 기능", desc: "", sizes: ["small", "wide"] },
};
const DEFAULT_LAYOUT = { pages: [[
  { id: "w1", type: "hero", size: "wide" }, { id: "w2", type: "plan", size: "wide" },
  { id: "w3", type: "inbox", size: "small" }, { id: "w4", type: "task", size: "small" },
]], removed_pins: [] };
const MAX_PER_PAGE = 8, MAX_PAGES = 5;
const clone = (o) => JSON.parse(JSON.stringify(o));
const newId = () => "w" + Math.random().toString(36).slice(2, 9);
const pinKey = (p) => `${p.skill ? "s" : "c"}:${p.ref ?? p.id}`;

let editMode = false, editLayout = null, curPage = 0;

// 비서가 '홈에 두기'로 올린 버튼은, 사용자가 지운 적이 없으면 저절로 자리를 잡는다
function effectiveLayout(h) {
  const L = clone(h.layout && h.layout.pages?.length ? h.layout : DEFAULT_LAYOUT);
  L.removed_pins = L.removed_pins || [];
  const have = new Set(L.pages.flat().filter((w) => w.type === "pin").map(pinKey));
  for (const p of (h.pins || [])) {
    const key = pinKey(p);
    if (have.has(key) || L.removed_pins.includes(key)) continue;
    const w = { id: newId(), type: "pin", size: "small", ref: p.id, skill: !!p.skill, label: p.label,
                icon: p.icon || "bolt", origin: p.origin || "user" };
    const page = L.pages.find((pg) => pg.length < MAX_PER_PAGE) || (L.pages.length < MAX_PAGES ? (L.pages.push([]), L.pages.at(-1)) : null);
    if (page) page.push(w);
  }
  return L;
}

  else if (run.status === "done") st.textContent = `${ago(run.at)}${run.summary ? " · " + run.summary : " 완료"}`;
  else st.textContent = `${ago(run.at)} · ${run.status === "stopped" ? "멈췄어요" : "그만뒀어요"}`;
  t.append(st);
  b.append(ic, t);
  b.onclick = () => runPin({ id: w.ref, skill: w.skill, label: w.label }, run);

function renderWidget(h, w) {
  switch (w.type) {
    case "hero": return heroCard(h);
    case "plan": return planCard(h);
    case "inbox": return inboxCard(h);
    case "task": return taskCard(h);
    case "events": return eventsCard(h);
    case "reminder": return reminderCard(h, w.size);
    case "notes": return notesCard(h, w.size);
    case "app": return appWidget(w);
    case "pin": return pinWidget(h, w);
  }
  return el("div", "bt card-w", "알 수 없는 위젯");
}

// ---- 페이지 그리기 ----
function paintHome(h) {
  if (h) h._heroTask = false;
  // 누르고 있는 동안 화면이 다시 그려지면, 손을 뗀 신호(pointerup)가 사라진 요소로 가서
  // 길게 누르기 타이머가 안 풀린다 → '건드리기만 해도 편집'이 되던 원인. 다시 그릴 땐 누르기를 취소한다.
  if (pressT) { clearTimeout(pressT); pressT = null; }
  lastHome = h;
  paintHeader();
  const L = editMode ? editLayout : effectiveLayout(h);
  const pages = L.pages.map((ws, pi) => {
    const page = el("div", "page"); page.dataset.page = pi;
    const grid = el("div", "bento");
    for (const w of ws) {
      const node = renderWidget(h, w);
      node.classList.toggle("w2", w.size === "wide");
      node.classList.remove("w2"); // 크기는 slot 이 잡는다
      const slot = el("div", "wslot" + (w.size === "wide" ? " w2" : ""));
      slot.dataset.wid = w.id; slot.append(node);
      if (editMode) addEditControls(slot, w);
      grid.append(slot);
    }
    if (editMode && ws.length < MAX_PER_PAGE) {
      const add = el("button", "wslot w2 addslot", "+ 위젯 추가");
      add.onclick = () => openWidgetPicker(pi); grid.append(add);
    }
    page.append(grid);
    return page;
  });
  const pager = $("pager");
  const keep = curPage;
  pager.replaceChildren(...pages);
  paintDots(L.pages.length);
  requestAnimationFrame(() => goPage(Math.min(keep, L.pages.length - 1), false));
  // 독 배지
  const tb = $("dockTasks").querySelector(".badge"); if (tb) tb.remove();
  if (h.asking) $("dockTasks").append(el("span", "badge", String(h.asking)));
  const ab = $("dockAll").querySelector(".badge"); if (ab) ab.remove();
  if (h.pending) $("dockAll").append(el("span", "badge", String(h.pending)));
}
function paintDots(n) {
  const d = $("dots"); d.replaceChildren();
  if (n < 2) return;
  for (let i = 0; i < n; i++) {
    const b = el("button", "dot-p" + (i === curPage ? " on" : "")); b.setAttribute("aria-label", `${i + 1}쪽`);
    b.onclick = () => goPage(i); d.append(b);
  }
}
function goPage(i, smooth = true) {
  const pager = $("pager"); const page = pager.children[i]; if (!page) return;
  pager.scrollTo({ left: page.offsetLeft - pager.offsetLeft, behavior: smooth ? "smooth" : "auto" });
  curPage = i; [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === i));
}
$("pager").addEventListener("scroll", () => {
  const p = $("pager"); const i = Math.round(p.scrollLeft / Math.max(1, p.clientWidth));
  if (i !== curPage) { curPage = i; [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === i)); }
}, { passive: true });

/* ---------- 편집 모드: 길게 누르기 → 지우기·크기·끌어서 옮기기 ---------- */
let pressT = null, suppressClick = false;
$("pager").addEventListener("pointerdown", (e) => {
  if (editMode || e.button > 0 || !e.target.closest(".wslot")) return;   // 빈 곳·쪽 넘기기는 편집 아님
  const x0 = e.clientX, y0 = e.clientY;
  clearTimeout(pressT);
  pressT = setTimeout(() => { pressT = null; suppressClick = true; navigator.vibrate?.(12); enterEdit(); }, 650);
  const cancel = (ev) => { if (ev.type !== "pointermove" || Math.hypot(ev.clientX - x0, ev.clientY - y0) > 8) { clearTimeout(pressT); pressT = null; off(); } };
  const off = () => { removeEventListener("pointermove", cancel); removeEventListener("pointerup", cancel); removeEventListener("pointercancel", cancel); };
  addEventListener("pointermove", cancel); addEventListener("pointerup", cancel); addEventListener("pointercancel", cancel);
});
// 길게 누른 그 손가락이 떼질 때의 '클릭'만 막는다. 화면이 다시 그려져 클릭이 안 생기는 경우가 많으니,
// 다음 손가락이 닿으면 막기를 풀어 다음 동작(빼기·크기)이 먹히게 한다.
document.addEventListener("pointerdown", () => { suppressClick = false; }, true);
// 길게 눌러 편집 모드로 들어간 그 손가락의 '클릭'만 막는다 (편집 모드의 빼기·크기 버튼은 살린다)
$("pager").addEventListener("click", (e) => {
  if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; return; }
  if (editMode && !e.target.closest(".wctl, .addslot")) { e.stopPropagation(); e.preventDefault(); }
}, true);
$("pager").addEventListener("contextmenu", (e) => e.preventDefault());
for (const ev of ["touchend", "touchcancel", "scroll"]) {
  $("pager").addEventListener(ev, () => { if (pressT) { clearTimeout(pressT); pressT = null; } }, { passive: true, capture: true });
}

function enterEdit() {
  if (editMode) return;
  editLayout = effectiveLayout(lastHome || {});
  editMode = true; document.body.classList.add("editing");
  $("editbar").hidden = false; $("avatar").hidden = true;
  paintHome(lastHome || {});
}
async function exitEdit(save = true) {
  if (!editMode) return;
  const L = { pages: editLayout.pages.filter((p) => p.length), removed_pins: editLayout.removed_pins || [] };
  if (!L.pages.length) L.pages = clone(DEFAULT_LAYOUT.pages);
  editMode = false; document.body.classList.remove("editing");
  $("editbar").hidden = true; $("avatar").hidden = false;
  if (save) {
    try {
      const saved = await post("/api/home/layout", L);
      if (lastHome) lastHome.layout = saved;
      const c = cache.peek("home"); if (c) c.layout = saved;
      toast("홈을 저장했어요.");
    } catch (e) { toast(e.message, "err"); }
  }
  curPage = Math.min(curPage, Math.max(0, L.pages.length - 1));
  paintHome(lastHome || {});
}
function addEditControls(slot, w) {
  const rm = el("button", "wctl rm"); rm.setAttribute("aria-label", `${WIDGETS[w.type]?.name || "위젯"} 빼기`);
  rm.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>';
  rm.onclick = (e) => {
    e.stopPropagation();
    for (const pg of editLayout.pages) { const i = pg.findIndex((x) => x.id === w.id); if (i >= 0) pg.splice(i, 1); }
    if (w.type === "pin") editLayout.removed_pins.push(pinKey(w));
    paintHome(lastHome || {});
  };
  slot.append(rm);
  const sizes = WIDGETS[w.type]?.sizes || [];
  if (sizes.length > 1) {
    const sz = el("button", "wctl sz", w.size === "wide" ? "작게" : "크게");
    sz.onclick = (e) => { e.stopPropagation(); w.size = w.size === "wide" ? "small" : "wide"; paintHome(lastHome || {}); };
    slot.append(sz);
  }
  slot.addEventListener("pointerdown", (e) => startDrag(e, slot));
}

// 끌어서 옮기기: 같은 쪽 안에서는 자리 바꾸기, 화면 가장자리에 잠깐 대면 옆 쪽으로 넘어간다
let drag = null;
function startDrag(e, slot) {
  if (!editMode || e.target.closest(".wctl")) return;
  const r = slot.getBoundingClientRect();
  drag = { slot, gx: e.clientX - r.left, gy: e.clientY - r.top, x0: e.clientX, y0: e.clientY, moved: false, edgeT: null };
  slot.setPointerCapture(e.pointerId);
  slot.addEventListener("pointermove", onDrag);
  slot.addEventListener("pointerup", endDrag, { once: true });
  slot.addEventListener("pointercancel", endDrag, { once: true });
}
function placeDragged(e) {
  const s = drag.slot; s.style.transform = "none";
  const n = s.getBoundingClientRect();
  s.style.transform = `translate(${e.clientX - drag.gx - n.left}px, ${e.clientY - drag.gy - n.top}px) scale(1.03)`;
}
function onDrag(e) {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
  drag.moved = true; drag.slot.classList.add("dragging");
  placeDragged(e);
  // 끌고 있는 위젯 자신은 빼고 그 아래에 무엇이 있는지 본다
  drag.slot.style.pointerEvents = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY)?.closest(".wslot:not(.addslot)");
  drag.slot.style.pointerEvents = "";
  if (under && under !== drag.slot && under.parentElement === drag.slot.parentElement) {
    const r = under.getBoundingClientRect();
    const before = e.clientY < r.top + r.height / 2 && (e.clientX < r.left + r.width / 2 || r.width < 200);
    under.parentElement.insertBefore(drag.slot, before ? under : under.nextSibling);
    placeDragged(e);
  }
  const edge = e.clientX < 28 ? -1 : e.clientX > innerWidth - 28 ? 1 : 0;
  if (edge && !drag.edgeT) {
    drag.edgeT = setTimeout(() => {
      drag.edgeT = null;
      let target = curPage + edge;
      if (target < 0) return;
      if (target >= editLayout.pages.length) {
        if (editLayout.pages.length >= MAX_PAGES) return;
        editLayout.pages.push([]); syncFromDom(); paintHome(lastHome || {}); drag = null; return;
      }
      const grid = $("pager").children[target]?.querySelector(".bento");
      if (!grid || grid.querySelectorAll(".wslot:not(.addslot)").length >= MAX_PER_PAGE) return;
      grid.insertBefore(drag.slot, grid.querySelector(".addslot"));
      goPage(target); placeDragged(e);
    }, 550);
  } else if (!edge && drag.edgeT) { clearTimeout(drag.edgeT); drag.edgeT = null; }
}
function endDrag() {
  if (!drag) return;
  const { slot, moved, edgeT } = drag; clearTimeout(edgeT);
  slot.removeEventListener("pointermove", onDrag);
  slot.classList.remove("dragging"); slot.style.transform = "";
  drag = null;
  if (moved) { syncFromDom(); paintHome(lastHome || {}); }
}
function syncFromDom() {
  const byId = new Map(editLayout.pages.flat().map((w) => [w.id, w]));
  const pages = [...$("pager").children].map((pg) =>
    [...pg.querySelectorAll(".wslot[data-wid]")].map((sl) => byId.get(sl.dataset.wid)).filter(Boolean));
  while (pages.length < editLayout.pages.length) pages.push([]);
  editLayout.pages = pages;
}

async function render(revalidate = true) {

      await SCREENS[current].render(body, cache.peek(key));

        cache.fresh(key).then((v) => {

/* ===================== 과제 엔진: 화면에서 바로 달리고, 저절로 갱신 ===================== */
// 크론(2분)을 기다리지 않는다. 과제가 생기거나 화면에 열린 과제가 보이면 곧바로 진행을 요청하고,
// 서버는 묻기·확인·완료·시간 한도까지 이어 달린다. 화면은 몇 초마다 새 상태를 받아 온다.
const driving = new Set();
const lastDrive = new Map();        // 과제 → 마지막으로 달리기를 끝낸 시각
let taskPoll = null;
const POLL_MS = 3500;
const AUTO_COOLDOWN_MS = 20000;     // 화면이 저절로 다시 달리게 할 때의 최소 간격 (오류가 나도 서버를 두드리지 않게)

function driveTask(id, auto = false) {
  if (!id || driving.has(id)) return;
  if (auto && Date.now() - (lastDrive.get(id) || 0) < AUTO_COOLDOWN_MS) return;
  driving.add(id);
  refreshTasksSoon(150);
  api(`/api/tasks/${id}/run`, { method: "POST", body: "{}" })
    .then((t) => announceTask(t))
    .catch((e) => { if (!/이미 진행/.test(e.message)) toast(e.message, "err"); })
    .finally(() => { driving.delete(id); lastDrive.set(id, Date.now()); cache.drop("tasks", "home", "actions"); refreshTasksSoon(0); });
}
function announceTask(t) {
  if (!t || !t.status || t.status === "open") return;
  const g = `'${(t.goal || "").slice(0, 18)}${(t.goal || "").length > 18 ? "…" : ""}'`;
  const msg = { done: `${g} 끝났어요.`, waiting_user: `${g} 진행 중에 물어볼 게 생겼어요.`,
                waiting_approval: `${g} 진행 중에 확인할 일이 생겼어요.`, stopped: `${g} 잠시 멈췄어요.` }[t.status];
  if (msg) toast(msg);
}
function typingInScreen() {
  const a = document.activeElement;
  return a && $("screenBody").contains(a) && (a.tagName === "INPUT" || a.tagName === "TEXTAREA");
}
function refreshTasksSoon(delay = POLL_MS) {
  clearTimeout(taskPoll);
  taskPoll = setTimeout(async () => {
    if (current !== "tasks" || document.hidden) return;
    if (typingInScreen()) return refreshTasksSoon();      // 답을 적는 중이면 화면을 갈아엎지 않는다
    try {
      const v = await cache.fresh("tasks");
      if (current === "tasks" && !typingInScreen()) await SCREENS.tasks.render($("screenBody"), v);
    } catch { /* 다음 차례에 다시 */ }
  }, delay);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && current === "tasks") refreshTasksSoon(0); });

const TASK_STATE = { open: "진행 중", waiting_user: "답을 기다려요", waiting_approval: "확인을 기다려요", done: "끝났어요", stopped: "멈췄어요" };
SCREENS.tasks = {

      const t = await post("/api/tasks", { goal: v }); driveTask(t?.id); await render(false);
    }));
    head.append(await shortcutBar("tasks"));
    const nodes = [...live, ...ended].map((t) => {
      const ended = t.status === "done" || t.status === "stopped";
      const running = t.status === "open" && (t.running || driving.has(t.id));
      const d = el("div", "card" + (t.status === "waiting_user" ? " ask" : "") + (ended ? " ended" : "") + (running ? " running" : ""));
      const lead = el("div", "lead");
      lead.append(miniIcon(t.icon || "dot", t.tint || "blue"), el("div", "t", t.goal));
      const st = el("div", "s");
      if (running) st.append(el("span", "live-dot"));
      st.append(`${running ? "지금 진행하는 중" : (TASK_STATE[t.status] || t.status)} · ${t.steps}/${t.max_steps}단계`);
      d.append(lead, st);
      if (!ended) {
        const bar = el("div", "progress"); const fill = el("i");
        fill.style.width = Math.min(100, Math.round((t.steps / Math.max(1, t.max_steps)) * 100)) + "%";
        bar.append(fill); d.append(bar);
      }
      const preview = t.status === "waiting_user" ? t.question
        : t.status === "done" ? (t.result || "").split("\n").slice(0, 3).join("\n")
        : t.status === "waiting_approval" ? "확인함에서 결정해 주시면 이어서 할게요." : (t.last_thought || "곧 시작할게요.");
      d.append(el("div", "b", preview + (t.status === "done" && (t.result || "").split("\n").length > 3 ? " …" : "")));
      const row = el("div", "row");
      if (t.status === "done" && t.result) row.append(button("결과 보기", "small", () => openResult(t.id)), whyBtn("task", t.id, t.goal));
      if (t.status === "waiting_user") {
        const a = input("text", "", { placeholder: "답을 적어 주세요" }); row.append(a,
          button("답하기", "small", async () => { await post(`/api/tasks/${t.id}/answer`, { text: a.value }); await render(); }));
      }
      if (t.status === "stopped") row.append(button("이어서 하기", "small", async () => {
        await post(`/api/tasks/${t.id}/resume`); driveTask(t.id); await render(false);
      }));
      if (!ended) row.append(button("그만두기", "ghost small", async () => { await post(`/api/tasks/${t.id}/cancel`); await render(); }));
      if (row.children.length) d.append(row);
      return d;
    });
    body.replaceChildren(head, ...(nodes.length ? nodes : [el("div", "empty-state", "맡은 일이 없어요.\n위에 적어서 바로 맡기거나, 자주 쓰는 일은 버튼으로 저장해 두세요.")]));
    // 화면에 열린 과제가 보이면, 누가 돌리고 있지 않은 것은 바로 달리게 한다 (버튼 없이)
    for (const t of live) if (t.status === "open" && !t.running) driveTask(t.id, true);
    if (live.some((t) => t.status === "open") || driving.size) refreshTasksSoon();
  },
};

const EVIDENCE_KIND = {

  calendar: ["오늘", null],
};
async function openWhy(kind, refId) {
  let w;
  try { w = await api(`/api/why/${kind}/${encodeURIComponent(refId)}`); }
  catch (e) {
    return openSheet("왜 이렇게 판단했나요", (s) => {
      s.append(el("p", "muted", /판단 기록이 없|404/.test(e.message)
        ? "이 일은 판단 기록을 남기기 전에 만들어졌어요. 앞으로 생기는 일부터 근거를 보여 드릴게요."
        : e.message));
      const f = el("div", "actions"); f.append(el("span"), button("닫기", "ghost", closeSheet)); s.append(f);
    });
  }
  openSheet("왜 이렇게 판단했나요", (s) => {
    s.classList.add("why-sheet");
    if (w.summary) s.append(el("p", "why-sum", w.summary));
    if (w.tainted) s.append(el("div", "taint", "검색 자료를 보고 나온 판단이에요. 웹페이지 글이 섞였을 수 있어 자동으로 하지 않고 꼭 물어봐요."));

    // 1) 판단 경로
    const steps = (w.steps || []).filter((st) => st.prompt);
    if (steps.length) {
      const sec = el("div", "sub"); sec.append(el("h3", "", "판단 경로"));
      const ol = el("ol", "why-path");
      for (const st of steps) {
        const li = el("li", st.grown ? "grown" : "");
        li.append(el("span", "wp", st.prompt));
        const meta = [];
        if (st.grown) meta.push("✦ 몰랑이에게서 자란 판단");
        if (st.p != null && st.alts > 1) meta.push(`갈래 ${st.alts}개 중 ${Math.round(st.p * 100)}%로 골랐어요`);
        if (meta.length) li.append(el("span", "wm", meta.join(" · ")));
        ol.append(li);
      }
      sec.append(ol); s.append(sec);
    }

    // 2) 근거
    const ev = w.evidence || [];
    const sec2 = el("div", "sub"); sec2.append(el("h3", "", "근거"));
    if (!ev.length) sec2.append(el("p", "muted", "따로 짚은 근거 없이 판단했어요."));
    for (const e of ev) {
      const [name, go] = EVIDENCE_KIND[e.kind] || ["자료", null];
      const canGo = go && (e.kind !== "web" || /^https?:\/\//.test(e.id || "")) && (e.kind !== "event" || e.id);
      const chip = el(canGo ? "button" : "div", "why-ev" + (canGo ? " go" : ""));
      chip.append(el("span", "wk", name), el("span", "wt", e.text || ""));
      if (canGo) { chip.type = "button"; chip.onclick = () => { if (e.kind !== "web") closeSheet(); go(e); }; }
      sec2.append(chip);
    }
    s.append(sec2);

    // 3) 판단 회상
    const rc = w.recalled || [];
    if (rc.length) {
      const sec3 = el("div", "sub"); sec3.append(el("h3", "", "떠올린 지난 판단"));
      sec3.append(el("p", "muted small", "비슷한 상황에서 받아들여졌던 판단을 참고했어요."));
      for (const r of rc) {
        const d = el("div", "why-rc");
        d.append(el("span", "wt", r.summary || "(내용 없음)"),
                 el("span", "wm", [r.at ? ago(r.at) : "", r.feedback >= 1 ? "✓ 받아들임" : r.feedback >= 0.5 ? "✓ 괜찮았음" : ""].filter(Boolean).join(" · ")));
        sec3.append(d);
      }
      s.append(sec3);
    }

    // 4) 이 판단이 어떻게 받아들여졌는지
    const fb = w.feedback;
    const fbText = fb == null ? "아직 답을 기다리고 있어요. 받아들이거나 넘기면 다음 판단이 그만큼 배워요."
      : fb >= 1 ? "받아들인 판단이에요. 비슷한 때 이 길을 더 자주 고르게 됐어요."
      : fb >= 0.5 ? "괜찮았던 판단으로 기록됐어요."
      : "넘긴 판단이에요. 비슷한 때 이 길을 덜 고르게 됐어요.";
    s.append(el("p", "why-fb" + (fb == null ? "" : fb >= 0.5 ? " ok" : " no"), fbText));
    const f = el("div", "actions"); f.append(el("span", "muted small", w.at ? ago(w.at) : ""), button("닫기", "ghost", closeSheet)); s.append(f);
  });
}

function splitResult(text) {
  // ```lang ... ``` 코드블록을 분리해 [{type:'text'|'code', lang, body}] 로
  const parts = []; const re = /```([\w+-]*)\n?([\s\S]*?)```/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parts.push({ type: "text", body: text.slice(last, m.index).trim() });
    parts.push({ type: "code", lang: m[1] || "", body: m[2].replace(/\n$/, "") });
    last = re.lastIndex;
  }
  if (last < text.length) parts.push({ type: "text", body: text.slice(last).trim() });
  return parts.filter((p) => p.body);
}
async function openResult(taskId) {
  let t;
  try { t = await api(`/api/tasks/${taskId}`); } catch (e) { return toast(e.message, "err"); }
  const result = t.result || "";
  openSheet(t.goal || "결과", (s) => {
    s.classList.add("result-sheet");
    if (t.reflection) s.append(el("p", "muted", "비서 메모: " + t.reflection + (t.quality ? ` (자평 ${t.quality}/5)` : "")));
    if (t.status === "done") s.append(whyBtn("task", t.id, t.goal, "어떻게 이 결과를 냈는지 보기"));
    for (const part of splitResult(result)) {
      if (part.type === "code") {
        const box = el("div", "codebox");
        const bar = el("div", "codebar");
        bar.append(el("span", "lang", part.lang || "code"),
          button("복사", "ghost small", async () => { await navigator.clipboard.writeText(part.body); toast("복사했어요."); }));
        const pre = el("pre"); pre.textContent = part.body;
        box.append(bar, pre); s.append(box);
      } else {
        const p2 = el("div", "resulttext"); p2.textContent = part.body; s.append(p2);
      }
    }
    const foot = el("div", "actions");
    foot.append(button("전체 복사", "ghost", async () => { await navigator.clipboard.writeText(result); toast("전체 복사했어요."); }),
      button("파일로 저장", "", () => {
        const blob = new Blob([result], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob); const a = el("a");
        a.href = url; a.download = (t.goal || "결과").slice(0, 30).replace(/[^\w가-힣-]/g, "_") + ".txt";
        a.click(); URL.revokeObjectURL(url);
      }));
    s.append(foot);
  });
}

function actionLead(a) {
  const [ic, tint] = ACTION_ICON[a.kind] || ["dot", "blue"];
  const lead = el("div", "lead"); lead.append(miniIcon(ic, tint), el("div", "t", a.label)); return lead;

function describe(a) {
  const g = a.args || {};
  if (a.kind === "event") return `${g.title || ""}${g.starts_at ? " · " + when(g.starts_at) : ""}${g.remind_before_min ? ` · ${g.remind_before_min}분 전 알림` : ""}`;
  if (a.kind === "reminder") return `${g.due_at ? when(g.due_at) : ""} · ${g.text || ""}`;
  if (a.kind === "create_skill") return `\u2018${g.name || ""}\u2019 — ${g.description || ""}\n${a.reason || ""}`.trim();
  if (a.kind === "suggest_shortcut") return `${a.reason || ""}\n만들면: ${g.app === "search" ? "검색" : "맡은 일"} 앱에 \u2018${g.label || ""}\u2019 버튼`.trim();

const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function urlB64ToBytes(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}
async function currentSub() {
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
async function enablePush() {
  if (isIOS() && !isStandalone()) throw new Error("아이폰은 홈 화면에 추가한 앱에서만 알림을 켤 수 있어요.\n사파리 공유 버튼 → 홈 화면에 추가 → 그 아이콘으로 열어서 다시 눌러 주세요.");
  if (!pushSupported()) throw new Error("이 브라우저는 앱 알림을 지원하지 않아요.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("알림이 허용되지 않았어요. 기기 설정에서 이 앱의 알림을 허용해 주세요.");
  const reg = await navigator.serviceWorker.register("/sw.js");
  await navigator.serviceWorker.ready;
  const { key } = await api("/api/push/key");
  const sub = (await reg.pushManager.getSubscription()) ||
    await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(key) });
  const device = isIOS() ? "아이폰" : /Android/.test(navigator.userAgent) ? "안드로이드" : "컴퓨터";
  await post("/api/push/subscribe", { subscription: sub.toJSON(), device });
}
async function disablePush() {
  const sub = await currentSub();
  if (sub) { await post("/api/push/unsubscribe", { endpoint: sub.endpoint }); await sub.unsubscribe(); }
}
