<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#E9EFEB; --surface:#F6F9F7; --ink:#1D2A2B; --muted:#5B6B69; --line:#C7D3CE;
  --accent:#2C6A64; --accent-ink:#F4FAF8; --wait:#A8741A; --wait-bg:#F4E9D2;
  --mine:#D9E7E2;
  --serif:"Gowun Batang", "Noto Serif KR", serif;
  --sans:"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121A1A; --surface:#1A2424; --ink:#E1EBE8; --muted:#97A9A5; --line:#2B3A39;
    --accent:#72B5AC; --accent-ink:#0F1A19; --wait:#E2B256; --wait-bg:#2E2717; --mine:#22322F;
    color-scheme: dark; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px;height:100%;display:flex;flex-direction:column}
[hidden]{display:none!important}

/* 로그인 */
.auth{margin:auto 0;padding:32px 0}
.auth h1{font:700 1.5rem/1.3 var(--serif);margin:0 0 6px}
.auth p{color:var(--muted);margin:0 0 24px}
.field{display:block;margin-bottom:12px}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.msg{min-height:1.4em;color:var(--muted);font-size:.9rem;margin-top:10px}

/* 이름 짓기 — 이 화면의 주인공은 이름 하나 */
.naming{margin:auto 0;padding:40px 0}
.naming .lead{color:var(--muted);margin:0 0 28px}
.naming .say{font:400 clamp(1.6rem,6vw,2.4rem)/1.35 var(--serif);margin:0}
.naming .say input{
  font:700 1em/1.2 var(--serif);color:var(--accent);background:transparent;border:0;
  border-bottom:2px solid var(--accent);width:6.5em;padding:0 .1em;text-align:center}
.naming .say input::placeholder{color:var(--line)}
.naming .note{color:var(--muted);font-size:.9rem;margin:20px 0 28px}

/* 대화 */
header.top{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 10px;border-bottom:1px solid var(--line)}
header.top h1{font:700 1.7rem/1.1 var(--serif);margin:0;color:var(--accent)}
header.top button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.9rem;padding:6px}

.tray{margin:14px 0 4px}
.tray h2{font-size:.95rem;font-weight:600;margin:0 0 8px;color:var(--wait)}
.item{background:var(--wait-bg);border-left:3px solid var(--wait);border-radius:4px 10px 10px 4px;padding:10px 12px;margin-bottom:8px}
.item.done{background:var(--surface);border-left-color:var(--line)}
.item .what{font-weight:600}
.item .detail{color:var(--muted);font-size:.9rem;margin:2px 0 8px;white-space:pre-wrap}
.item .row .btn{padding:7px 14px;font-size:.9rem}

.log{flex:1;overflow-y:auto;padding:14px 0 8px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.bubble.agent{background:var(--surface);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.user{background:var(--mine);align-self:flex-end;border-bottom-right-radius:4px}
.bubble.thinking{color:var(--muted)}
.empty{color:var(--muted);margin:auto 0;text-align:center}

form.compose{display:flex;gap:8px;padding:10px 0 14px;border-top:1px solid var(--line)}
form.compose textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);max-height:140px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:min(92vw,460px)}
dialog::backdrop{background:rgb(0 0 0 / .35)}
dialog code{display:block;background:var(--bg);padding:8px 10px;border-radius:8px;word-break:break-all;margin:8px 0}
@media (prefers-reduced-motion: no-preference){
  .bubble.new{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- 1. 로그인 -->
  <section class="auth" id="auth" hidden>
    <h1>내 비서</h1>
    <p>로그인하면 나만의 비서를 만날 수 있어요.</p>
    <label class="field"><input id="email" type="email" placeholder="이메일" autocomplete="email"></label>
    <label class="field"><input id="pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password"></label>
    <div class="row">
      <button class="btn" id="login">로그인</button>
      <button class="btn ghost" id="signup">계정 만들기</button>
    </div>
    <div class="msg" id="authMsg"></div>
  </section>

  <!-- 2. 이름 짓기 -->
  <section class="naming" id="naming" hidden>
    <p class="lead">먼저 비서에게 이름을 지어 주세요.</p>
    <p class="say">안녕하세요, 저는<br><input id="nameInput" maxlength="12" placeholder="이름" aria-label="비서 이름">예요.</p>
    <p class="note">나중에 설정에서 바꿀 수 있어요. 열두 글자까지 돼요.</p>
    <button class="btn" id="saveName" disabled>이 이름으로 정하기</button>
    <div class="msg" id="nameMsg"></div>
  </section>

  <!-- 3. 대화 -->
  <section id="main" hidden style="display:flex;flex-direction:column;height:100%">
    <header class="top">
      <h1 id="agentName"></h1>
      <button id="openSettings">설정</button>
    </header>

    <div class="tray" id="pendingTray" hidden>
      <h2 id="pendingTitle"></h2>
      <div id="pendingList"></div>
    </div>
    <div class="tray" id="recentTray" hidden>
      <h2 style="color:var(--muted)">묻지 않고 해 둔 일</h2>
      <div id="recentList"></div>
    </div>

    <div class="log" id="log" aria-live="polite"></div>

    <form class="compose" id="compose">
      <textarea id="text" rows="1" placeholder="부탁할 일을 적어 주세요"></textarea>
      <button class="btn" id="send">보내기</button>
    </form>
  </section>
</div>

<dialog id="settings">
  <h3 style="margin-top:0">설정</h3>
  <label class="field">비서 이름
    <input id="rename" maxlength="12">
  </label>
  <button class="btn ghost" id="saveRename">이름 바꾸기</button>
  <p style="margin-top:20px;margin-bottom:0">폰 알림 받기: ntfy 앱에서 아래 주제를 구독하세요. 주제가 곧 비밀번호라 남에게 알려 주지 마세요.</p>
  <code id="topic"></code>
  <div class="row" style="justify-content:space-between;margin-top:16px">
    <button class="btn ghost" id="logout">로그아웃</button>
    <button class="btn" id="closeSettings">닫기</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let sb, agentName = "";

async function api(path, opts = {}) {
  const { data } = await sb.auth.getSession();
  const token = data.session?.access_token;
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(opts.headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `요청이 실패했어요 (${res.status})`);
  return body;
}

function show(id) {
  for (const s of ["auth", "naming", "main"]) $(s).hidden = s !== id;
}

/* ---------- 로그인 ---------- */
async function auth(kind) {
  const email = $("email").value.trim(), password = $("pw").value;
  $("authMsg").textContent = "";
  try {
    const fn = kind === "signup" ? sb.auth.signUp : sb.auth.signInWithPassword;
    const { data, error } = await fn.call(sb.auth, { email, password });
    if (error) throw error;
    if (kind === "signup" && !data.session) {
      $("authMsg").textContent = "확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.";
      return;
    }
    await enter();
  } catch (e) {
    $("authMsg").textContent = e.message === "Invalid login credentials"
      ? "이메일이나 비밀번호가 맞지 않아요." : e.message;
  }
}

/* ---------- 들어가기 ---------- */
async function enter() {
  const me = await api("/api/me");
  $("topic").textContent = me.ntfy_topic || "";
  if (!me.name) { show("naming"); $("nameInput").focus(); return; }
  setName(me.name);
  show("main");
  await Promise.all([loadHistory(), loadActions()]);
}

function setName(n) {
  agentName = n;
  $("agentName").textContent = n;
  $("rename").value = n;
  document.title = n;
}

/* ---------- 이름 짓기 ---------- */
$("nameInput").addEventListener("input", (e) => {
  const v = e.target.value.trim();
  $("saveName").disabled = !v;
  e.target.style.width = Math.max(3, Math.min(12, v.length + 1.5)) + "em";
});
$("saveName").addEventListener("click", async () => {
  try {
    const { name } = await api("/api/name", { method: "POST", body: JSON.stringify({ name: $("nameInput").value.trim() }) });
    setName(name);
    show("main");
    addBubble("agent", `${name}예요. 기억해 둘 일, 알림, 글 초안 같은 걸 부탁해 주세요.\n남에게 닿는 일은 꼭 먼저 여쭤볼게요.`);
    loadActions();
  } catch (e) { $("nameMsg").textContent = e.message; }
});

/* ---------- 대화 ---------- */
function addBubble(role, text, extra = "") {
  const empty = $("log").querySelector(".empty");
  if (empty) empty.remove();
  const b = document.createElement("div");
  b.className = `bubble ${role} new ${extra}`;
  b.textContent = text;
  $("log").appendChild(b);
  $("log").scrollTop = $("log").scrollHeight;
  return b;
}

async function loadHistory() {
  $("log").innerHTML = "";
  const { items } = await api("/api/history");
  if (!items.length) {
    $("log").innerHTML = `<p class="empty">아직 나눈 이야기가 없어요. 부탁할 일을 적어 보세요.</p>`;
    return;
  }
  for (const m of items) addBubble(m.role === "user" ? "user" : "agent", m.text);
}

$("compose").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = ""; $("send").disabled = true;
  addBubble("user", text);
  const wait = addBubble("agent", "생각하는 중…", "thinking");
  try {
    const res = await api("/api/chat", { method: "POST", body: JSON.stringify({ text }) });
    wait.classList.remove("thinking");
    wait.textContent = res.reply;
    await loadActions();
  } catch (err) {
    wait.textContent = err.message;
  } finally { $("send").disabled = false; $("text").focus(); }
});
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("compose").requestSubmit(); }
});

/* ---------- 확인함 ---------- */
function describe(a) {
  const g = a.args || {};
  if (a.kind === "reminder") {
    const t = g.due_at ? new Date(g.due_at).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
    return `${t}에 알림: ${g.text || ""}`;
  }
  if (a.kind === "draft") return `${g.to ? g.to + "에게 · " : ""}${g.text || ""}`;
  return g.text || g.query || a.reason || "";
}

function itemEl(a, buttons) {
  const d = document.createElement("div");
  d.className = "item" + (buttons.includes("undo") ? " done" : "");
  d.innerHTML = `<div class="what"></div><div class="detail"></div><div class="row"></div>`;
  d.querySelector(".what").textContent = a.label;
  d.querySelector(".detail").textContent = describe(a);
  const labels = { approve: "하기", reject: "하지 않기", undo: "되돌리기" };
  for (const verb of buttons) {
    const b = document.createElement("button");
    b.className = "btn" + (verb === "approve" ? "" : " ghost");
    b.textContent = labels[verb];
    b.addEventListener("click", async () => {
      b.disabled = true;
      try { await api(`/api/actions/${a.id}/${verb}`, { method: "POST" }); }
      catch (e) { alert(e.message); }
      loadActions();
    });
    d.querySelector(".row").appendChild(b);
  }
  return d;
}

async function loadActions() {
  const { pending, recent } = await api("/api/actions");
  $("pendingTray").hidden = !pending.length;
  $("pendingTitle").textContent = `확인이 필요해요 (${pending.length})`;
  $("pendingList").replaceChildren(...pending.map((a) => itemEl(a, ["approve", "reject"])));
  $("recentTray").hidden = !recent.length;
  $("recentList").replaceChildren(...recent.map((a) => itemEl(a, a.tier === 3 ? ["undo"] : [])));
}

/* ---------- 설정 ---------- */
$("openSettings").addEventListener("click", () => $("settings").showModal());
$("closeSettings").addEventListener("click", () => $("settings").close());
$("saveRename").addEventListener("click", async () => {
  try {
    const { name } = await api("/api/name", { method: "POST", body: JSON.stringify({ name: $("rename").value.trim() }) });
    setName(name); $("settings").close();
  } catch (e) { alert(e.message); }
});
$("logout").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

/* ---------- 시작 ---------- */
(async () => {
  const cfg = await fetch("/api/config").then((r) => r.json());
  sb = window.supabase.createClient(cfg.supabase_url, cfg.anon_key);
  $("login").addEventListener("click", () => auth("login"));
  $("signup").addEventListener("click", () => auth("signup"));
  const { data } = await sb.auth.getSession();
  if (data.session) { try { await enter(); } catch { show("auth"); } }
  else show("auth");
})();
</script>
</body>
</html>
