/* ===================== 과제 엔진: 화면에서 바로 달리고, 저절로 갱신 ===================== */
// 크론(2분)을 기다리지 않는다. 과제가 생기거나 화면에 열린 과제가 보이면 곧바로 진행을 요청하고,
// 서버는 묻기·확인·완료·시간 한도까지 이어 달린다. 화면은 몇 초마다 새 상태를 받아 온다.
const driving = new Set();
const lastDrive = new Map();        // 과제 → 마지막으로 달리기를 끝낸 시각
let taskPoll = null;
const POLL_MS = 3500;
const AUTO_COOLDOWN_MS = 20000;     // 화면이 저절로 다시 달리게 할 때의 최소 간격 (오류가 나도 서버를 두드리지 않게)

function driveTask(id, auto = false) {
  if (!id || driving.has(id)) return;
  if (auto && Date.now() - (lastDrive.get(id) || 0) < AUTO_COOLDOWN_MS) return;
  driving.add(id);
  refreshTasksSoon(150);
  api(`/api/tasks/${id}/run`, { method: "POST", body: "{}" })
    .then((t) => announceTask(t))
    .catch((e) => { if (!/이미 진행/.test(e.message)) toast(e.message, "err"); })
    .finally(() => { driving.delete(id); lastDrive.set(id, Date.now()); cache.drop("tasks", "home", "actions"); refreshTasksSoon(0); });
}
function announceTask(t) {
  if (!t || !t.status || t.status === "open") return;
  const g = `'${(t.goal || "").slice(0, 18)}${(t.goal || "").length > 18 ? "…" : ""}'`;
  const msg = { done: `${g} 끝났어요.`, waiting_user: `${g} 진행 중에 물어볼 게 생겼어요.`,
                waiting_approval: `${g} 진행 중에 확인할 일이 생겼어요.`, stopped: `${g} 잠시 멈췄어요.` }[t.status];
  if (msg) toast(msg);
}
function typingInScreen() {
  const a = document.activeElement;
  return a && $("screenBody").contains(a) && (a.tagName === "INPUT" || a.tagName === "TEXTAREA");
}
function refreshTasksSoon(delay = POLL_MS) {
  clearTimeout(taskPoll);
  taskPoll = setTimeout(async () => {
    if (current !== "tasks" || document.hidden) return;
    if (typingInScreen()) return refreshTasksSoon();      // 답을 적는 중이면 화면을 갈아엎지 않는다
    try {
      const v = await cache.fresh("tasks");
      if (current === "tasks" && !typingInScreen()) await SCREENS.tasks.render($("screenBody"), v);
    } catch { /* 다음 차례에 다시 */ }
  }, delay);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && current === "tasks") refreshTasksSoon(0); });

/* ===================== 맡은 일 ===================== */
const TASK_STATE = { open: "진행 중", waiting_user: "답을 기다려요", waiting_approval: "확인을 기다려요", done: "끝났어요", stopped: "멈췄어요" };

    }));
    head.append(await shortcutBar("tasks"));
    const nodes = [...live, ...ended].map((t) => {
      const ended = t.status === "done" || t.status === "stopped";
      const running = t.status === "open" && (t.running || driving.has(t.id));
      const d = el("div", "card" + (t.status === "waiting_user" ? " ask" : "") + (ended ? " ended" : "") + (running ? " running" : ""));

      st.append(`${running ? "지금 진행하는 중" : (TASK_STATE[t.status] || t.status)} · ${t.steps}/${t.max_steps}단계`);
      d.append(lead, st);
      if (!ended) {
        const bar = el("div", "progress"); const fill = el("i");
        fill.style.width = Math.min(100, Math.round((t.steps / Math.max(1, t.max_steps)) * 100)) + "%";
        bar.append(fill); d.append(bar);
      }
      const preview = t.status === "waiting_user" ? t.question
        : t.status === "done" ? (t.result || "").split("\n").slice(0, 3).join("\n")
        : t.status === "waiting_approval" ? "확인함에서 결정해 주시면 이어서 할게요." : (t.last_thought || "곧 시작할게요.");
      d.append(el("div", "b", preview + (t.status === "done" && (t.result || "").split("\n").length > 3 ? " …" : "")));
      const row = el("div", "row");

      if (t.status === "waiting_user") {
        const a = input("text", "", { placeholder: "답을 적어 주세요" }); row.append(a,
          button("답하기", "small", async () => { await post(`/api/tasks/${t.id}/answer`, { text: a.value }); await render(); }));
      }
      if (t.status === "stopped") row.append(button("이어서 하기", "small", async () => {
        await post(`/api/tasks/${t.id}/resume`); driveTask(t.id); await render(false);
      }));

      if (row.children.length) d.append(row);
      return d;
    });
    body.replaceChildren(head, ...(nodes.length ? nodes : [el("div", "empty-state", "맡은 일이 없어요.\n위에 적어서 바로 맡기거나, 자주 쓰는 일은 버튼으로 저장해 두세요.")]));
    // 화면에 열린 과제가 보이면, 누가 돌리고 있지 않은 것은 바로 달리게 한다 (버튼 없이)
    for (const t of live) if (t.status === "open" && !t.running) driveTask(t.id, true);
    if (live.some((t) => t.status === "open") || driving.size) refreshTasksSoon();
  },
};

const DOC_ACCEPT = ".xlsx,.xlsm,.docx,.pdf,.hwp,.hwpx,.png,.jpg,.jpeg,.webp,.gif,.bmp,.heic,.heif,image/*";
const DOC_MAX = 20 * 1024 * 1024;
const DOC_BADGE = { xlsx: ["XLS", "x"], docx: ["DOC", "w"], pdf: ["PDF", "p"], hwp: ["HWP", "h"], hwpx: ["HWP", "h"], image: ["IMG", "i"] };

  hwpx: "예: 날짜를 6월 3일로 바꿔 줘 · 마지막에 문의처 문단 추가",
  hwp: "예: 날짜를 바꿔 줘 — 옛 한글(.hwp)은 고친 결과가 워드 파일로 나와요",
  pdf: "예: 2쪽 지워 줘 · 1쪽 돌려 줘 · 이름 칸에 김민수 — 글을 고치면 워드 파일로 나와요",

};
const fsize = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(n / 1024))}KB`);
function docBadge(kind) {
  const [t, c] = DOC_BADGE[kind] || ["FILE", "i"];
  return el("span", "dbadge " + c, t);
}
function docMeta(d) {
  return [fsize(d.size || 0), d.pages && d.kind !== "image" ? `${d.pages}${d.kind === "xlsx" ? "개 시트" : "쪽"}` : "", ago(d.created_at)].filter(Boolean).join(" · ");
}

let docsTab = "files";
function docsTabs(nTpl) {
  const seg = el("div", "dseg");
  for (const [k, label] of [["files", "문서"], ["tpl", nTpl ? `양식 ${nTpl}` : "양식"]]) {

    b.onclick = async () => { docsTab = k; $("addBtn").onclick = SCREENS.docs.add; await render(false); };
    seg.append(b);
  }
  return seg;
}
SCREENS.docs = {
  cacheKey: "docs",
  async render(body, data) {
    const tpls = await cache.get("templates").catch(() => ({ items: [] }));
    if (docsTab === "tpl") return renderTemplates(body, tpls.items);
    const { items, used, quota } = data || await cache.get("docs");
    const nodes = [docsTabs(tpls.items.length)];
    const drop = el("button", "dropzone");
    drop.type = "button";
    drop.append(el("span", "dz-t", "문서 올리기"), el("span", "dz-s", "엑셀 · PDF · 워드 · 한글(hwp·hwpx) · 사진"));
    drop.onclick = pickDocs;
    nodes.push(drop, ...docUploading.map(uploadRow));
    if (items.length) {
      const bar = el("div", "dquota");
      const fill = el("i"); fill.style.width = `${Math.min(100, (used / quota) * 100).toFixed(1)}%`;

let docUploading = [];          // 올리는 중인 파일 (화면에 바로 보이게)
function uploadRow(u) {
  const d = el("div", "item doc up");
  const lead = el("div", "lead"); const txt = el("div", "dtxt");
  txt.append(el("div", "t", u.name), el("div", "s", u.state));
  lead.append(docBadge(u.kind), txt); d.append(lead);
  return d;
}
function pickDocs(opt = {}) {
  const inp = el("input"); inp.type = "file"; inp.multiple = !opt.asTemplate;
  inp.accept = opt.asTemplate ? ".xlsx,.xlsm,.docx,.hwpx,.pdf" : DOC_ACCEPT;
  inp.onchange = () => uploadDocs([...inp.files], opt);
  inp.click();
}
function docKind(name, type) {
  const ext = (name.split(".").pop() || "").toLowerCase();
  if (["xlsx", "xlsm"].includes(ext)) return "xlsx";
  if (["docx", "pdf", "hwp", "hwpx"].includes(ext)) return ext;
  if ((type || "").startsWith("image/") || ["png", "jpg", "jpeg", "webp", "gif", "bmp", "heic", "heif"].includes(ext)) return "image";
  return null;
}
// 아이폰 사진(HEIC)·아주 큰 사진은 올리기 전에 JPEG 로 줄인다 (서버가 못 여는 형식 + 저장 용량)
async function shrinkImage(file) {
  const heic = /heic|heif/i.test(file.type) || /\.(heic|heif)$/i.test(file.name);
  if (!heic && file.size < 3 * 1024 * 1024) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.88));
    if (!blob) throw new Error("x");
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch {
    if (heic) throw new Error("이 사진 형식(HEIC)을 열지 못했어요. 사진 앱에서 '호환성 우선'으로 저장해 올려 주세요.");
    return file;
  }
}
async function uploadDocs(files, opt = {}) {
  if (!files.length) return;
  const { data } = await sb.auth.getSession();
  const uid = data?.session?.user?.id;
  if (!uid) return toast("다시 로그인해 주세요.", "err");
  const jobs = files.map((f) => ({ file: f, name: f.name, kind: docKind(f.name, f.type), state: "올리는 중…" }));
  docUploading.push(...jobs);
  if (current === "docs") await render(false);
  let ok = 0, found = 0;
  for (const j of jobs) {
    try {
      if (!j.kind) throw new Error(/\.(xls|doc|ppt|pptx)$/i.test(j.name) ? "옛 형식이에요. 새 형식(.xlsx·.docx)으로 저장해 올려 주세요." : "엑셀·PDF·워드·한글·사진만 올릴 수 있어요.");
      let f = j.file;
      if (j.kind === "image") f = await shrinkImage(f);
      if (f.size > DOC_MAX) throw new Error("20MB 보다 큰 파일은 올릴 수 없어요.");
      const ext = (f.name.split(".").pop() || "bin").toLowerCase();
      const rand = [...crypto.getRandomValues(new Uint8Array(12))].map((x) => x.toString(16).padStart(2, "0")).join("");
      const path = `${uid}/${rand}.${ext}`;
      const up = await sb.storage.from("docs").upload(path, f, { contentType: f.type || "application/octet-stream", upsert: false });
      if (up.error) throw new Error("파일을 올리지 못했어요. 잠시 뒤 다시 해 주세요.");
      j.state = j.kind === "image" ? "사진을 보는 중…" : "읽는 중…";
      if (current === "docs") await render(false);
      const made = await post("/api/docs", { path, name: f.name, mime: f.type || "", size: f.size });
      ok++;
      if (made.found) { found += made.found; cache.drop("actions", "home"); }
      if (opt.asTemplate) { docUploading = docUploading.filter((x) => x !== j); cache.drop("docs"); return openTplDraft({ doc: made }); }
    } catch (e) {
      toast(`${j.name}: ${e.message}`, "err");
    } finally {
      docUploading = docUploading.filter((x) => x !== j);
    }
  }
  cache.drop("docs");
  if (ok) toast((ok > 1 ? `${ok}개를 올렸어요.` : "올렸어요. 눌러서 묻거나 고쳐 보세요.")
                + (found ? ` 문서에서 챙길 일 ${found}개를 찾아 확인함에 올렸어요.` : ""));
  if (current === "docs") await render(false); else if (ok) await openApp("docs");
}

/* ===================== 문서 ↔ 비서: 보내기 · 알림 · 초안 · 할 일 찾기 ===================== */
function docTools(d) {
  const row = el("div", "dtools");
  const send = button("보내기", "small", () => shareDoc(d, send));
  row.append(send,
    button("알림 걸기", "ghost small", () => editReminder({ text: `'${d.name.replace(/\.[^.]+$/, "")}' 챙기기`, due_at: inHour(24), doc_id: d.id, doc_name: d.name })),
    button("초안 쓰기", "ghost small", () => draftFromDoc(d)));
  if (d.kind !== "xlsx") row.append(button("할 일 찾기", "ghost small", async () => {
    const r = await post(`/api/docs/${d.id}/scan`);
    toast(r.found ? `챙길 일 ${r.found}개를 확인함에 올렸어요.` : "따로 챙길 마감·일정을 찾지 못했어요.");
    if (r.found) await openDoc(d.id);
  }));
  return row;
}
// 휴대폰 공유 창으로 직접 보낸다 (카톡·메일·메시지). 비서가 대신 보내지는 않는다.
// iOS 는 공유를 '누른 그 순간'에만 허락하므로: 첫 누름에 파일을 받아 두고, 버튼이 '지금 보내기'로 바뀐다.
async function shareDoc(d, btn) {
  if (btn._file) {
    try { await navigator.share({ files: [btn._file], title: d.name }); }
    catch (e) { if (e.name !== "AbortError") { toast("공유하지 못했어요. 내려받아 보내 주세요.", "err"); await docDownload(d.id); } }
    return;
  }
  const { url } = await api(`/api/docs/${d.id}/url`);
  if (!navigator.canShare) { location.href = url; return; }
  const blob = await (await fetch(url)).blob();
  const file = new File([blob], d.name, { type: blob.type || "application/octet-stream" });
  if (!navigator.canShare({ files: [file] })) { location.href = url; return; }
  btn._file = file; btn.textContent = "지금 보내기"; btn.classList.add("ready");
  toast("준비됐어요. '지금 보내기'를 눌러 보낼 곳을 고르세요.");
}
function draftFromDoc(d) {
  openSheet("이 문서로 초안 쓰기", (s) => {
    s.classList.add("doc-sheet");
    const ask = input("textarea", "", { rows: 3, placeholder: "예: 학부모님께 보낼 안내 문자, 3줄로 · 교감 선생님께 회신 메일 · 반 아이들에게 알릴 말" });
    s.append(field("어떤 글을 쓸까요?", ask), el("p", "muted small", "문서에 적힌 내용만으로 써요. 초안은 '초안'에 저장되고, 보내기는 직접 해요."));
    const foot = el("div", "actions");
    foot.append(button("취소", "ghost", closeSheet), button("초안 쓰기", "", async () => {
      const r = await post(`/api/docs/${d.id}/draft`, { text: ask.value.trim() });
      cache.drop("drafts");
      editDraft({ id: r.draft_id, content: r.text, doc_id: d.id });
    }));
    s.append(foot);

}
function docLinks(d) {
  const L = d.links || {};
  const n = (L.pending || []).length + (L.reminders || []).length + (L.events || []).length + (L.drafts || []).length;
  if (!n) return null;
  const sec = el("div", "sub"); sec.append(el("h3", "", "이 문서와 연결된 것"));
  for (const a of L.pending || []) {
    const b = itemBtn(`확인 기다림 · ${(ACTION_LABEL[a.kind] || a.kind)}`, describe({ ...a, args: a.args }), () => { closeSheet(); openApp("inbox"); });
    b.classList.add("pend"); sec.append(b);
  }
  for (const r of L.reminders || []) sec.append(itemBtn(`알림 · ${r.text}`, when(r.due_at) + (r.repeat ? ` · ↻ ${repeatLabel(r.repeat)}` : ""), () => editReminder({ ...r, doc_id: d.id, doc_name: d.name })));
  for (const e of L.events || []) sec.append(itemBtn(`일정 · ${e.title}`, when(e.starts_at), () => editEvent(e.id)));
  for (const r of L.drafts || []) sec.append(itemBtn(`초안 · ${r.content.split("\n")[0].slice(0, 30)}`, ago(r.updated_at), () => editDraft({ ...r, doc_id: d.id })));
  return sec;
}
const ACTION_LABEL = { reminder: "알림", event: "일정", draft: "초안", doc_edit: "문서 고치기", doc_make: "양식으로 만들기", doc_new: "문서 파일", note: "메모" };

// 초안 → 문서: 새 워드 파일 / 내 양식에 넣기 / 기존 문서에 반영
async function draftToDoc(d) {
  const [tpls, dl] = await Promise.all([cache.get("templates").catch(() => ({ items: [] })), cache.get("docs").catch(() => ({ items: [] }))]);
  openSheet("초안으로 문서 만들기", (s) => {
    s.classList.add("doc-sheet");
    const res = el("div");
    const done = (r) => {
      const card = el("div", "card dresult");
      card.append(el("div", "b", r.doc.name));
      if (r.empty?.length) card.append(el("p", "dnote", `비워 둔 칸: ${r.empty.join(", ")}`));
      if (r.changes) card.append(changeList(r.changes, r.notes));
      const row = el("div", "row");
      row.append(button("내려받기", "small", () => docDownload(r.doc.id)), button("열어 보기", "ghost small", () => openDoc(r.doc.id)));

    const opt = (title, sub, fn) => { const b = el("button", "item"); b.type = "button"; b.append(el("div", "t", title), el("div", "s", sub)); b.onclick = async () => { b.disabled = true; res.replaceChildren(thinkingLine("만드는 중…")); try { done(await fn()); } catch (e) { res.replaceChildren(el("p", "dnote", e.message)); } finally { b.disabled = false; } }; return b; };
    s.append(opt("새 워드 파일로", "# 제목, - 목록 줄은 모양을 살려요", () => post(`/api/drafts/${d.id}/to_doc`, { mode: "new" })));
    if (tpls.items.length) {

      for (const t of tpls.items.slice(0, 6)) s.append(opt(`양식 · ${t.name}`, `초안 내용을 칸 ${t.fields.length}개에 나눠 넣어요`, () => post(`/api/drafts/${d.id}/to_doc`, { mode: "template", template_id: t.id })));
    }
    const editable = (dl.items || []).filter((x) => ["docx", "hwpx", "xlsx"].includes(x.kind)).slice(0, 6);
    if (editable.length) {
      s.append(el("div", "group", "기존 문서에 반영"));
      for (const x of editable) s.append(opt(`고치기 · ${x.name}`, "모양은 그대로, 초안과 다른 내용만 바꿔 새 버전으로", () => post(`/api/drafts/${d.id}/to_doc`, { mode: "edit", doc_id: x.id })));
    }
    s.append(res);
    const foot = el("div", "actions"); foot.append(el("span"), button("닫기", "ghost", closeSheet)); s.append(foot);
  });
}

/* ===================== 양식함: 문서 → 양식 → 내용만 넣어 새 문서 ===================== */
const TPL_TYPES = [["text", "짧은 글"], ["long", "여러 줄"], ["date", "날짜"], ["number", "숫자"]];
function tplWhere(f) {
  if (f.mode === "cell") return `${f.sheet ? f.sheet + "!" : ""}${f.cell}${f.example ? ` · 지금 '${f.example}'` : ""}`;
  if (f.mode === "form") return `PDF 칸 '${f.find}'`;
  if (f.mode === "after") return `'${f.find}' 뒤에`;
  if (/^\{\{.*\}\}$/.test(f.find || "")) return "문서에 적어 둔 자리";
  return `'${(f.find || "").slice(0, 40)}' 자리`;
}
function renderTemplates(body, items) {
  const nodes = [docsTabs(items.length)];
  const cta = el("button", "dropzone"); cta.type = "button";
  cta.append(el("span", "dz-t", "파일 올려서 양식 만들기"), el("span", "dz-s", "워드 · 한글(hwpx) · 엑셀 · PDF 양식"));
  cta.onclick = () => pickDocs({ asTemplate: true });
  nodes.push(cta);
  for (const t of items) {
    const b = el("button", "item doc"); const lead = el("div", "lead"); const txt = el("div", "dtxt");
    txt.append(el("div", "t", t.name), el("div", "s", [`칸 ${t.fields.length}개`, t.uses ? `${t.uses}번 씀` : "아직 안 씀", ago(t.updated_at || t.created_at)].join(" · ")));
    lead.append(docBadge(t.kind), txt); b.append(lead);
    b.onclick = () => openTemplate(t.id);
    nodes.push(b);
  }
  if (!items.length) nodes.push(el("div", "empty-state", "저장한 양식이 없어요.\n가정통신문, 공문, 신청서처럼 자주 쓰는 문서를\n양식으로 저장해 두면 내용만 넣어 바로 만들어요.\n\n문서를 열고 '이 문서를 양식으로 저장'을 눌러도 돼요."));
  body.replaceChildren(...nodes);
}

// 칸 정하기: 새 양식(doc) 또는 칸 고치기(tpl)
async function openTplDraft({ doc, tpl }) {
  let name, fields, kind = doc?.kind || tpl?.kind;
  if (tpl) { name = tpl.name; fields = tpl.fields.map((f) => ({ ...f })); }
  else {
    openSheet("양식 만들기", (s) => s.append(thinkingLine("문서를 읽고 바뀌는 자리를 찾는 중… (10초쯤)")));
    try { const p = await post("/api/templates/propose", { doc_id: doc.id }); name = p.name; fields = p.fields; }
    catch (e) { return openSheet("양식 만들기", (s) => { s.append(el("p", "dnote", e.message)); const f = el("div", "actions"); f.append(el("span"), button("닫기", "ghost", closeSheet)); s.append(f); }); }
  }
  openSheet(tpl ? "칸 고치기" : "양식 만들기", (s) => {
    s.classList.add("doc-sheet");
    const nm = input("text", name, { placeholder: "양식 이름 (예: 체험학습 안내)" });
    s.append(field("양식 이름", nm));
    s.append(el("p", "muted small", "바뀌는 자리를 '칸'으로 만들어요. 문서의 모양·글꼴·표는 그대로 두고 칸만 바꿔요."));
    const list = el("div", "tplfields");
    const paint = () => {
      list.replaceChildren();
      if (!fields.length) list.append(el("p", "muted", "칸이 없어요. 아래에서 추가해 주세요."));
      fields.forEach((f, i) => {
        const row = el("div", "tplf");
        const lab = input("text", f.label, { placeholder: "칸 이름" }); lab.oninput = () => { f.label = lab.value; };
        const typ = el("select"); for (const [k, l] of TPL_TYPES) { const o = el("option", "", l); o.value = k; if ((f.type || "text") === k) o.selected = true; typ.append(o); }
        typ.onchange = () => { f.type = typ.value; };
        const rm = el("button", "iconbtn"); rm.type = "button"; rm.setAttribute("aria-label", `'${f.label}' 칸 빼기`);
        rm.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
        rm.onclick = () => { fields.splice(i, 1); paint(); };
        const top = el("div", "tplf-top"); top.append(lab, typ, rm);
        row.append(top, el("div", "tplf-w", tplWhere(f)));
        list.append(row);
      });
    };
    paint();
    s.append(list);
    if (kind !== "pdf") {
      const add = el("details", "tpladd"); add.append(el("summary", "", "+ 칸 직접 추가"));
      const a1 = input("text", "", { placeholder: kind === "xlsx" ? "칸 주소 (예: B3 또는 성적!B3)" : "문서에서 바꿀 글 (문서에 있는 그대로)" });
      const a2 = input("text", "", { placeholder: "칸 이름 (예: 날짜)" });
      const after = el("label", "chk"); const cb = el("input"); cb.type = "checkbox"; after.append(cb, el("span", "", "이 글 뒤에 붙이기 (빈칸 양식: '성명:' 같은)"));
      add.append(a1, a2);
      if (kind !== "xlsx") add.append(after);
      add.append(button("추가", "small", () => {
        const w = a1.value.trim(), lb = a2.value.trim();
        if (!w || !lb) return toast("두 칸을 모두 적어 주세요.", "err");
        if (kind === "xlsx") { const [sh, c] = w.includes("!") ? w.split("!") : ["", w]; fields.push({ label: lb, mode: "cell", sheet: sh, cell: c.toUpperCase(), type: "text" }); }
        else fields.push({ label: lb, find: w, mode: cb.checked ? "after" : "replace", type: "text" });
        a1.value = a2.value = ""; cb.checked = false; paint();
      }));
      add.append(el("p", "muted small", "팁: 한글·워드에서 칸 자리에 {{칸 이름}} 을 적어 올리면 그 자리를 정확히 칸으로 써요."));
      s.append(add);
    }
    const foot = el("div", "actions");
    foot.append(button("취소", "ghost", closeSheet), button(tpl ? "저장" : "양식 저장", "", async () => {
      const body = { name: nm.value.trim(), fields };
      const r = tpl ? await post(`/api/templates/${tpl.id}/update`, body) : await post("/api/templates", { ...body, doc_id: doc.id });
      if (r.lost?.length) toast(`문서에서 자리를 못 찾아 뺀 칸: ${r.lost.join(", ")}`, "err");
      else toast(tpl ? "칸을 고쳤어요." : "양식으로 저장했어요.");
      docsTab = "tpl";
      if (current === "docs") await render(false);
      await openTemplate(r.template.id);
    }));
    s.append(foot);
  });
}

async function openTemplate(tid) {
  let t;
  try { t = await api(`/api/templates/${tid}`); } catch (e) { return toast(e.message, "err"); }
  openSheet(t.name, (s) => {
    s.classList.add("doc-sheet");
    const head = el("div", "dhead"); head.append(docBadge(t.kind), el("span", "muted small", `칸 ${t.fields.length}개 · ${t.uses ? `${t.uses}번 씀` : "아직 안 씀"}`));
    s.append(head);

    // 한 번에 말하기
    const say = el("div", "sub"); say.append(el("h3", "", "한 번에 말하기"));
    const said = input("textarea", "", { rows: 2, placeholder: "예: 6월 3일 수요일에 국립중앙박물관으로 가요. 준비물은 도시락이랑 물" });
    const inputs = {};
    say.append(said, button("칸 채우기", "small", async () => {
      if (!said.value.trim()) return said.focus();
      const r = await post(`/api/templates/${t.id}/fill`, { text: said.value.trim() });
      const n = Object.keys(r.values).length;
      for (const [k, v] of Object.entries(r.values)) if (inputs[k]) { inputs[k].value = v; inputs[k].classList.add("filled"); }
      toast(n ? `칸 ${n}개를 채웠어요. 확인해 주세요.` : "채울 내용을 찾지 못했어요.", n ? "" : "err");
    }));
    s.append(say);

    // 칸
    const form = el("div", "sub"); form.append(el("h3", "", "내용"));

    }

    // 2) 근거

    if (!ev.length) sec2.append(el("p", "muted", "따로 짚은 근거 없이 판단했어요."));
    for (const e of ev) {

      const chip = el(canGo ? "button" : "div", "why-ev" + (canGo ? " go" : ""));

function splitResult(text) {
  // ```lang ... ``` 코드블록을 분리해 [{type:'text'|'code', lang, body}] 로
  const parts = []; const re = /```([\w+-]*)\n?([\s\S]*?)```/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parts.push({ type: "text", body: text.slice(last, m.index).trim() });
    parts.push({ type: "code", lang: m[1] || "", body: m[2].replace(/\n$/, "") });
    last = re.lastIndex;
  }
  if (last < text.length) parts.push({ type: "text", body: text.slice(last).trim() });
  return parts.filter((p) => p.body);
}
async function openResult(taskId) {
  let t;
  try { t = await api(`/api/tasks/${taskId}`); } catch (e) { return toast(e.message, "err"); }
  const result = t.result || "";
  openSheet(t.goal || "결과", (s) => {
    s.classList.add("result-sheet");
    if (t.reflection) s.append(el("p", "muted", "비서 메모: " + t.reflection + (t.quality ? ` (자평 ${t.quality}/5)` : "")));
    if (t.status === "done") s.append(whyBtn("task", t.id, t.goal, "어떻게 이 결과를 냈는지 보기"));
    for (const part of splitResult(result)) {
      if (part.type === "code") {
        const box = el("div", "codebox");
        const bar = el("div", "codebar");
        bar.append(el("span", "lang", part.lang || "code"),
          button("복사", "ghost small", async () => { await navigator.clipboard.writeText(part.body); toast("복사했어요."); }));
        const pre = el("pre"); pre.textContent = part.body;
        box.append(bar, pre); s.append(box);
      } else {
        const p2 = el("div", "resulttext"); p2.textContent = part.body; s.append(p2);
      }
    }
    const foot = el("div", "actions");
    foot.append(button("전체 복사", "ghost", async () => { await navigator.clipboard.writeText(result); toast("전체 복사했어요."); }),
      button("파일로 저장", "", () => {
        const blob = new Blob([result], { type: "text/plain;charset=utf-8" });

        a.href = url; a.download = (t.goal || "결과").slice(0, 30).replace(/[^\w가-힣-]/g, "_") + ".txt";
        a.click(); URL.revokeObjectURL(url);
      }));
    s.append(foot);
  });
}

function describe(a) {

  if (a.kind === "create_skill") return `\u2018${g.name || ""}\u2019 — ${g.description || ""}\n${a.reason || ""}`.trim();

  if (a.kind === "pin_shortcut") return a.reason || `\u2018${g.label || ""}\u2019 버튼을 홈에 둘까요?`;
  if (a.kind === "self_task") return `${g.goal || ""}\n${a.reason || ""}`.trim();
  if (a.kind === "draft") return `${g.to ? g.to + "에게 · " : ""}${g.text || ""}`;
  if (a.kind === "doc_edit") return `'${g.doc_name || "문서"}' — ${g.instruction || ""}\n원본은 그대로, 고친 새 버전으로`;
  if (a.kind === "doc_make") return `'${g.template_name || "양식"}' 양식으로 — ${g.text || Object.values(g.values || {}).join(", ")}`;
  if (a.kind === "doc_new") return `'${g.title || "새 문서"}.docx' — ${(g.text || "").split("\n").slice(0, 2).join(" ")}`;
  return g.text || g.query || a.reason || "";
}

/* ===================== 설정 ===================== */
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function urlB64ToBytes(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}
async function currentSub() {
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
async function enablePush() {
  if (isIOS() && !isStandalone()) throw new Error("아이폰은 홈 화면에 추가한 앱에서만 알림을 켤 수 있어요.\n사파리 공유 버튼 → 홈 화면에 추가 → 그 아이콘으로 열어서 다시 눌러 주세요.");
  if (!pushSupported()) throw new Error("이 브라우저는 앱 알림을 지원하지 않아요.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("알림이 허용되지 않았어요. 기기 설정에서 이 앱의 알림을 허용해 주세요.");
  const reg = await navigator.serviceWorker.register("/sw.js");
  await navigator.serviceWorker.ready;
  const { key } = await api("/api/push/key");
  const sub = (await reg.pushManager.getSubscription()) ||
    await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(key) });
  const device = isIOS() ? "아이폰" : /Android/.test(navigator.userAgent) ? "안드로이드" : "컴퓨터";
  await post("/api/push/subscribe", { subscription: sub.toJSON(), device });
}
async function disablePush() {
  const sub = await currentSub();
  if (sub) { await post("/api/push/unsubscribe", { endpoint: sub.endpoint }); await sub.unsubscribe(); }
}

function suggestChips(suggest, target = null) {

  for (const sg of suggest) {

    c.textContent = "+ " + (sg.label || sg.kind);

        c.textContent = "✓ " + (sg.label || "완료");
        c.classList.add("done");
        if (r?.status === "proposed") { c.textContent = "확인함에서 결정하기"; c.onclick = () => openApp("inbox"); c.disabled = false; c.classList.remove("done"); }

function linkChips(actions, target = null, docsRead = []) {
  const wrap = el("div", "links");
  for (const d of docsRead || []) {            // 이번 답에 읽은 문서 → 눌러서 열기

    if (a.status === "proposed") { const c = el("button", "", "확인함에서 결정하기"); c.onclick = () => openApp("inbox"); wrap.append(c); continue; }
    for (const [k, [app, label]] of Object.entries(OPEN_LINK)) {
      if (a.result?.[k] != null) {

(function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;                     // 지원 안 하는 기기면 버튼을 숨긴 채 둔다
  const mic = $("mic"); if (!mic) return;
  mic.hidden = false;
  let rec = null, listening = false, base = "";
  mic.addEventListener("click", () => {
    if (listening) { rec && rec.stop(); return; }
    rec = new SR();
    rec.lang = "ko-KR"; rec.interimResults = true; rec.continuous = false;
    base = $("text").value ? $("text").value + " " : "";
    rec.onstart = () => { listening = true; mic.classList.add("on"); };
    rec.onresult = (e) => {
      let txt = "";
      for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      $("text").value = base + txt;
    };
    rec.onerror = (e) => { if (e.error === "not-allowed") toast("마이크 권한을 허용해 주세요."); };
    rec.onend = () => { listening = false; mic.classList.remove("on"); $("text").focus(); };
    try { rec.start(); } catch { /* 이미 돌고 있으면 무시 */ }
  });
})();

let authMode = "login";
function setAuthMode(m) {

function setAuthMsg(text, ok = false) {

function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

async function submitAuth() {
  const email = $("email").value.trim();
  const password = $("pw").value;
  $("email").classList.toggle("bad", !!email && !validEmail(email));
  if (!validEmail(email)) return setAuthMsg("이메일 형식을 확인해 주세요.");
  if (password.length < 6) return setAuthMsg("비밀번호는 6자 이상이어야 해요.");
  if (authMode === "signup" && password !== $("pw2").value) return setAuthMsg("비밀번호가 서로 달라요.");
  if (authMode === "signup" && !$("consent").checked) return setAuthMsg("이용약관과 개인정보처리방침에 동의해 주세요.");

  $("authSubmit").disabled = true;
  setAuthMsg(authMode === "signup" ? "계정을 만드는 중…" : "로그인 중…");
  try {
    if (authMode === "signup") {
      const { data, error } = await sb.auth.signUp({
        email, password, options: { emailRedirectTo: location.origin },
      });
      if (error) throw error;
      if (!data.session) {   // 확인 메일 방식
        setAuthMsg("확인 메일을 보냈어요. 메일의 링크를 누르면 바로 시작돼요. 메일이 안 보이면 스팸함도 확인해 주세요.", true);
        return;
      }
      await enter();         // 확인 메일이 꺼져 있으면 바로 입장
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await enter();
    }
  } catch (e) {
    const msg = e.message || "";
    setAuthMsg(
      msg.includes("Invalid login") ? "이메일이나 비밀번호가 맞지 않아요." :
      msg.includes("already registered") || msg.includes("already been") ? "이미 가입된 이메일이에요. 로그인해 주세요." :
      msg.includes("not confirmed") ? "메일 확인이 아직 안 됐어요. 메일의 링크를 눌러 주세요." :
      msg,
    );
  } finally { $("authSubmit").disabled = false; }
}

async function forgotPassword() {
  const email = $("email").value.trim();
  if (!validEmail(email)) return setAuthMsg("재설정 메일을 받을 이메일을 먼저 적어 주세요.");

    if (error) throw error;
    setAuthMsg("비밀번호 재설정 메일을 보냈어요.", true);
  } catch (e) { setAuthMsg(e.message); }

function josaGa(w) {                  // 받침이 있으면 '이', 없으면 '가'
  const c = w.charCodeAt(w.length - 1);
  return w + (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 ? "이" : "가");
}
function showTour(force = false) {
  if (!force && ls(TOUR_KEY)) return;
  if ($("tour")) return;
  const root = el("div"); root.id = "tour"; root.setAttribute("role", "dialog"); root.setAttribute("aria-label", "둘러보기");
  const top = el("div", "tr-top");
  const brand = el("span", "tr-brand"); brand.innerHTML = ensoSVG() + `<span>${josaGa(agentName || "비서")} 다른 점</span>`;
  const skip = el("button", "tr-skip", "건너뛰기");
  top.append(brand, skip);
  const view = el("div", "tr-view"), track = el("div", "tr-track");
  for (const s of TOUR) {
    const sl = el("section", "tr-slide");
    const st = el("div", "tr-stage"); st.innerHTML = s.stage;
    const k = el("p", "tr-k", s.k), hh = el("h2", "tr-h"), pp = el("p", "tr-p");
    hh.innerHTML = s.h; pp.innerHTML = s.p;
    sl.append(st, k, hh, pp); track.append(sl);
  }
  view.append(track);
  const foot = el("div", "tr-foot"), dots = el("div", "tr-dots"), btns = el("div", "tr-btns");
  TOUR.forEach(() => dots.append(el("i")));
  foot.append(dots, btns);
  root.append(top, view, foot);
  document.body.append(root);
  requestAnimationFrame(() => root.classList.add("on"));

  let i = 0;
  const close = () => { ls(TOUR_KEY, "1"); ls("biseo.welcomed", "1"); root.classList.remove("on"); setTimeout(() => root.remove(), 320); };
  const pushOn = () => { try { return Notification.permission === "granted"; } catch { return true; } };
  const paint = () => {
    track.style.transform = `translateX(${-100 * i}%)`;
    [...dots.children].forEach((d, n) => d.classList.toggle("on", n === i));
    skip.style.visibility = i === TOUR.length - 1 ? "hidden" : "visible";
    const last = i === TOUR.length - 1;
    const b = [];
    if (i > 0 && !(last && !pushOn())) b.push(button("이전", "ghost", () => { i--; paint(); }));
    if (!last) b.push(button("다음", "", () => { i++; paint(); }));
    else if (pushOn()) b.push(button("시작하기", "", close));
    else b.push(button("나중에", "ghost", close), button("알림 켜고 시작", "", async () => {
      try { await enablePush(); toast("알림을 켰어요."); } catch (e) { toast(e.message, "err"); }
      close();
    }));
    btns.replaceChildren(...b);
  };
  skip.onclick = close;
  // 밀어서 넘기기
  let x0 = null;
  view.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  view.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) < 45) return;
    i = Math.max(0, Math.min(TOUR.length - 1, i + (dx < 0 ? 1 : -1))); paint();
  });
  root.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" && i < TOUR.length - 1) { i++; paint(); }
    if (e.key === "ArrowLeft" && i > 0) { i--; paint(); }
    if (e.key === "Escape") close();
  });
  root.tabIndex = -1; root.focus();
  paint();
}
function welcome() { showTour(); }

/* ===================== 시작 ===================== */
(async () => {
  let cfg;
  try {
    const r = await fetch("/api/config"); const raw = await r.text();
    if (!r.ok) throw new Error(`/api/config 가 ${r.status} 를 돌려줬어요.\n${raw.slice(0, 300)}`);
    cfg = JSON.parse(raw);
  } catch (e) { return fail("서버에 연결하지 못했어요", e.message + "\n\nVercel 대시보드의 Logs 에서 api/index 오류를 확인해 주세요."); }
  if (!cfg.supabase_url || !cfg.anon_key) return fail("설정이 비어 있어요", "Vercel 환경변수 SUPABASE_URL, SUPABASE_ANON_KEY 를 넣고 다시 배포(Redeploy)해 주세요.");
  if (!window.supabase) return fail("로그인 도구를 불러오지 못했어요", "네트워크를 확인하고 새로고침해 주세요.");
  sb = window.supabase.createClient(cfg.supabase_url, cfg.anon_key);
  $("tabLogin").onclick = () => setAuthMode("login");
  $("tabSignup").onclick = () => setAuthMode("signup");
  $("authForm").addEventListener("submit", (e) => { e.preventDefault(); submitAuth(); });
  $("forgot").onclick = forgotPassword;
  $("pwEye").onclick = () => {
    const on = $("pw").type === "password";
    $("pw").type = on ? "text" : "password";
    $("pwEye").textContent = on ? "숨기기" : "보기";
  };
  setAuthMode("login");

  // 비밀번호 재설정 메일의 링크로 돌아온 경우: 새 비밀번호를 정하게 한다
  sb.auth.onAuthStateChange(async (event) => {
    if (event === "PASSWORD_RECOVERY") {
      show("auth");
      openSheet("새 비밀번호 정하기", (s) => {
        const np = input("password", "", { placeholder: "6자 이상", autocomplete: "new-password" });
        s.append(field("새 비밀번호", np));
        const foot = el("div", "actions");
        foot.append(el("span"), button("바꾸기", "", async () => {
          if (np.value.length < 6) throw new Error("비밀번호는 6자 이상이어야 해요.");
          const { error } = await sb.auth.updateUser({ password: np.value });
          if (error) throw error;
          closeSheet(); toast("비밀번호를 바꿨어요.");
          await enter().catch(() => {});
        }));
        s.append(foot); setTimeout(() => np.focus(), 50);
      });
    }
  });

  const { data } = await sb.auth.getSession();
  if (!data.session) return show("auth");
  try { await enter(); } catch (e) { fail("비서를 불러오지 못했어요", e.message); }
})();
</script>
